services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mandoforge
      POSTGRES_PASSWORD: ${MANDOFORGE_POSTGRES_PASSWORD:?MANDOFORGE_POSTGRES_PASSWORD must be set}
      POSTGRES_DB: mandoforge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandoforge -d mandoforge"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MANDOFORGE_PROCESS_ROLE: api
      MANDOFORGE_ADDR: 0.0.0.0:8787
      MANDOFORGE_TENANT_ID: ${MANDOFORGE_TENANT_ID:-00000000-0000-4000-8000-000000000001}
      MANDOFORGE_TENANT_ROUTING_MODE: ${MANDOFORGE_TENANT_ROUTING_MODE:-single_runtime_tenant}
      MANDOFORGE_WORKSPACE_ROOT: /var/lib/mandoforge/workspaces
      DATABASE_URL: postgres://mandoforge:${MANDOFORGE_POSTGRES_PASSWORD:?MANDOFORGE_POSTGRES_PASSWORD must be set}@postgres:5432/mandoforge
      MANDOFORGE_WORKER_TOKEN: ${MANDOFORGE_WORKER_TOKEN:?MANDOFORGE_WORKER_TOKEN must be set}
      MANDOFORGE_WORKER_SUBJECT: ${MANDOFORGE_WORKER_SUBJECT:-mandoforge-worker}
      MANDOFORGE_EXECUTION_WORKER: ${MANDOFORGE_EXECUTION_WORKER:-queue}
      MANDOFORGE_PROVIDER_BASE_URL: ${MANDOFORGE_PROVIDER_BASE_URL:-}
      MANDOFORGE_PROVIDER_API_KEY: ${MANDOFORGE_PROVIDER_API_KEY:-}
      MANDOFORGE_PROVIDER_MODEL: ${MANDOFORGE_PROVIDER_MODEL:-gpt-5.5-mini}
      MANDOFORGE_SHELL_RUNNER: ${MANDOFORGE_SHELL_RUNNER:-host}
      MANDOFORGE_SHELL_DOCKER_IMAGE: ${MANDOFORGE_SHELL_DOCKER_IMAGE:-alpine:3.20}
      MANDOFORGE_DB_MAX_CONNECTIONS: ${MANDOFORGE_DB_MAX_CONNECTIONS:-20}
      MANDOFORGE_SERVICE_NAME: mandoforge-api
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - workspace-data:/var/lib/mandoforge/workspaces

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["mandoforge-api"]
    environment:
      MANDOFORGE_PROCESS_ROLE: worker
      MANDOFORGE_TENANT_ID: ${MANDOFORGE_TENANT_ID:-00000000-0000-4000-8000-000000000001}
      MANDOFORGE_TENANT_ROUTING_MODE: ${MANDOFORGE_TENANT_ROUTING_MODE:-single_runtime_tenant}
      MANDOFORGE_WORKSPACE_ROOT: /var/lib/mandoforge/workspaces
      DATABASE_URL: postgres://mandoforge:${MANDOFORGE_POSTGRES_PASSWORD:?MANDOFORGE_POSTGRES_PASSWORD must be set}@postgres:5432/mandoforge
      MANDOFORGE_WORKER_TOKEN: ${MANDOFORGE_WORKER_TOKEN:?MANDOFORGE_WORKER_TOKEN must be set}
      MANDOFORGE_WORKER_SUBJECT: ${MANDOFORGE_WORKER_SUBJECT:-mandoforge-worker}
      MANDOFORGE_PROVIDER_BASE_URL: ${MANDOFORGE_PROVIDER_BASE_URL:-}
      MANDOFORGE_PROVIDER_API_KEY: ${MANDOFORGE_PROVIDER_API_KEY:-}
      MANDOFORGE_PROVIDER_MODEL: ${MANDOFORGE_PROVIDER_MODEL:-gpt-5.5-mini}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MANDOFORGE_SECRET_PROVIDER: ${MANDOFORGE_SECRET_PROVIDER:-reserved}
      MANDOFORGE_VAULT_ADDR: ${MANDOFORGE_VAULT_ADDR:-}
      MANDOFORGE_VAULT_NAMESPACE: ${MANDOFORGE_VAULT_NAMESPACE:-}
      MANDOFORGE_VAULT_MOUNT: ${MANDOFORGE_VAULT_MOUNT:-kv}
      MANDOFORGE_VAULT_TOKEN: ${MANDOFORGE_VAULT_TOKEN:-}
      MANDOFORGE_SHELL_RUNNER: ${MANDOFORGE_SHELL_RUNNER:-host}
      MANDOFORGE_SHELL_DOCKER_IMAGE: ${MANDOFORGE_SHELL_DOCKER_IMAGE:-alpine:3.20}
      MANDOFORGE_SERVICE_NAME: mandoforge-worker
      WORKER_ID: compose-worker-1
      POLL_INTERVAL_SECONDS: ${MANDOFORGE_WORKER_POLL_INTERVAL_SECONDS:-0.5}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped
    volumes:
      - workspace-data:/var/lib/mandoforge/workspaces

volumes:
  postgres-data:
  workspace-data:
