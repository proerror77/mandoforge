apiVersion: v1
kind: Namespace
metadata:
  name: mandoforge-ax-pilot
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ax-redis
  namespace: mandoforge-ax-pilot
  labels:
    app.kubernetes.io/name: ax-redis
    app.kubernetes.io/part-of: ax
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ax-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ax-redis
    spec:
      containers:
        - name: redis
          image: docker.io/library/redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ax-redis
  namespace: mandoforge-ax-pilot
  labels:
    app.kubernetes.io/name: ax-redis
    app.kubernetes.io/part-of: ax
spec:
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app.kubernetes.io/name: ax-redis

