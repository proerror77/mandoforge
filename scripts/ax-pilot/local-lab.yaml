apiVersion: v1
kind: Namespace
metadata:
  name: mandoforge-ax-pilot
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ax-controller
  namespace: mandoforge-ax-pilot
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ax-controller
  namespace: mandoforge-ax-pilot
  labels:
    app.kubernetes.io/name: ax-controller
    app.kubernetes.io/part-of: ax
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ax-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ax-controller
    spec:
      serviceAccountName: ax-controller
      containers:
        - name: controller
          image: localhost:5001/mandoforge-ax-controller@sha256:f5bed442d7874fa9c71c1f64067970f2a219e5bf5d00c34a114334daa96782fb
          imagePullPolicy: IfNotPresent
          args:
            - "--redis-addr=ax-redis.mandoforge-ax-pilot.svc.cluster.local:6379"
            - "--substrate-endpoint=api.ate-system.svc.cluster.local:443"
            - "--substrate-authority=api.ate-system.svc"
            - "--substrate-token-file=/var/run/secrets/ateapi/token"
            - "--substrate-ca-file=/run/servicedns-ca/trust-bundle.pem"
            - "--template=default-template"
            - "--template-atespace=mandoforge-ax-pilot"
          env:
            - name: ATENET_ROUTER_ADDR
              value: "atenet-router.ate-system.svc.cluster.local:80"
            - name: AX_SNAPSHOTS_BUCKET
              value: "gs://ate-snapshots/mandoforge-ax-pilot/"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - mountPath: /var/run/secrets/ateapi
              name: ate-token
              readOnly: true
            - mountPath: /run/servicedns-ca
              name: servicedns-ca
              readOnly: true
      volumes:
        - name: ate-token
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  audience: api.ate-system.svc
                  expirationSeconds: 7200
                  path: token
        - name: servicedns-ca
          projected:
            defaultMode: 420
            sources:
              - clusterTrustBundle:
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: trust-bundle.pem
                  signerName: servicedns.podcert.ate.dev/identity

