<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MandoForge Agent OS Kernel</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <aside class="sidebar">
        <div>
          <p class="eyebrow">MandoForge</p>
          <h1>Agent OS Kernel</h1>
        </div>
        <button id="new-session">Run Diagnostics Demo</button>
        <section>
          <h2>Agent Builder</h2>
          <form id="agent-form" class="stack-form">
            <label>
              Name
              <input name="name" required value="Operations Review Agent" />
            </label>
            <label>
              Model
              <input name="model" required value="gpt-5.4-mini" />
            </label>
            <label>
              Tools
              <input name="tools" value="file.read,sql.get_schema,sql.query,shell.exec,file.write" />
            </label>
            <label>
              Instructions
              <textarea name="system_prompt" rows="4">Use runtime tools through policy and preserve an auditable session timeline.</textarea>
            </label>
            <button type="submit">Create Agent</button>
          </form>
        </section>
        <section>
          <h2>Agents</h2>
          <div id="agents" class="list"></div>
        </section>
        <section>
          <h2>Approvals</h2>
          <div id="approvals" class="list"></div>
        </section>
      </aside>

      <section class="conversation">
        <header>
          <div>
            <p class="eyebrow">Session Console</p>
            <h2 id="session-title">No session selected</h2>
          </div>
          <span id="session-status" class="status">idle</span>
        </header>
        <div id="final-report" class="report"></div>
        <section class="detail-section">
          <h2>Artifacts</h2>
          <div id="artifacts" class="list"></div>
          <div id="artifact-detail" class="detail-panel"></div>
        </section>
        <section class="detail-section">
          <h2>Tool Calls</h2>
          <div id="tool-calls" class="list"></div>
          <div id="tool-detail" class="detail-panel"></div>
        </section>
        <section class="detail-section">
          <h2>Audit Log</h2>
          <div id="audit-logs" class="list"></div>
          <div id="audit-detail" class="detail-panel"></div>
        </section>
        <section class="detail-section">
          <h2>Admin Console</h2>
          <div class="ops-grid">
            <div>
              <h3>Usage</h3>
              <button type="button" class="secondary form-inline-action" id="create-usage-rollup">Snapshot Rollup</button>
              <div id="usage-summary" class="detail-panel"></div>
              <div id="usage-rollups" class="list"></div>
            </div>
            <div>
              <h3>Providers</h3>
              <form id="provider-form" class="stack-form compact-form">
                <label>
                  Name
                  <input name="name" required value="governed-mock" />
                </label>
                <label>
                  Type
                  <input name="provider_type" required value="mock" />
                </label>
                <label>
                  Model
                  <input name="default_model" value="gpt-5.4-mini" />
                </label>
                <label>
                  Daily request limit
                  <input name="daily_request_limit" type="number" min="0" value="100" />
                </label>
                <label>
                  Per request cents
                  <input name="per_request_cents" type="number" min="0" step="0.01" value="0" />
                </label>
                <label>
                  Prompt 1K token cents
                  <input name="per_1k_prompt_tokens_cents" type="number" min="0" step="0.01" value="0" />
                </label>
                <label>
                  Completion 1K token cents
                  <input name="per_1k_completion_tokens_cents" type="number" min="0" step="0.01" value="0" />
                </label>
                <button type="submit">Save Provider</button>
              </form>
              <div id="providers" class="list"></div>
            </div>
            <div>
              <h3>Eval Runs</h3>
              <div id="eval-runs" class="list"></div>
            </div>
            <div>
              <h3>MCP Servers</h3>
              <form id="mcp-form" class="stack-form compact-form">
                <label>
                  Team ID
                  <input name="team_id" required placeholder="Team UUID" />
                </label>
                <label>
                  Server name
                  <input name="name" required value="docs" />
                </label>
                <label>
                  Transport
                  <input name="transport" required value="http" />
                </label>
                <label>
                  Tool allowlist
                  <input name="tool_allowlist" value="search,query" />
                </label>
                <button type="submit">Save MCP Server</button>
                <button type="button" class="secondary form-inline-action" id="load-mcp">Load Team Servers</button>
              </form>
              <div id="mcp-servers" class="list"></div>
            </div>
            <div>
              <h3>Governance</h3>
              <div id="governance-status" class="detail-panel"></div>
            </div>
          </div>
        </section>
      </section>

      <section class="timeline">
        <header>
          <p class="eyebrow">Append-only Timeline</p>
          <h2>Events</h2>
        </header>
        <div id="events" class="events"></div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
