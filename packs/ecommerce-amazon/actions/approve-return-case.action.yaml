id: approve-return-case
object_type: amazon_return_case
connector_id: amazon-selling-partner-api
operation_id: return-case-approve
side_effect_class: marketplace_refund_write
parameters:
  - name: return_id
    type: ObjectReference<amazon_return_case>
    required: true
  - name: approval_reason
    type: String
    required: true
validations:
  rules:
    - return case belongs to tenant-bound seller_id and marketplace_id
    - return evidence satisfies after-sales policy
    - approval payload digest matches return_id, operation_id, and approval_reason
effects:
  native_connector_call: native.connector.call
  audit_event: amazon.action.approve_return_case
approval:
  approval_required: true
  approver_role: admin
  approval_commit_token_required: true
  payload_digest_required: true
