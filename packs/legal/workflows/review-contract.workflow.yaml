id: review-contract
entry_agent: reader
semantic_scopes:
  domain_scope: legal
  workflow_scope: contract-review
  share_policy: isolated
  lane_scope: contract
observability:
  expected_events:
    - workflow.run.started
    - workflow.step.started
    - workflow.step.completed
    - workflow.run.completed
  required_evidence:
    - session_events
    - workflow_step_runs
    - context_packet
    - tool_call_refs
    - artifact_refs
    - approval_refs
  budget:
    max_turns: 12
    max_tool_calls: 24
    max_runtime_seconds: 900
    max_cost_usd_micros: 5000000
  failure_policy:
    status_values:
      - completed
      - blocked
      - failed
      - approval_required
    report_fields:
      - completed_steps
      - failed_steps
      - evidence_gaps
      - approval_gaps
      - next_safe_action

steps:
  - agent: reader
    observability:
      step_key: step-1-reader
      expected_events:
        - workflow.step.started
        - context_packet.generated
        - workflow.step.completed
      required_evidence:
        - context_packet
        - tool_call_refs
        - source_refs
        - artifact_refs
    required_profiles:
      - legal-playbook
      - connector-map
    required_schemas:
      - contract-review
    skills:
      - review-contract
    output_schema: contract-review
  - agent: analyzer
    observability:
      step_key: step-2-analyzer
      expected_events:
        - workflow.step.started
        - context_packet.generated
        - workflow.step.completed
      required_evidence:
        - context_packet
        - tool_call_refs
        - source_refs
        - artifact_refs
    handoff_intent: classify-contract-risk
    required_profiles:
      - legal-playbook
      - risk-policy
    required_schemas:
      - contract-review
      - handoff
  - agent: writer
    observability:
      step_key: step-3-writer
      expected_events:
        - workflow.step.started
        - context_packet.generated
        - workflow.step.completed
      required_evidence:
        - context_packet
        - tool_call_refs
        - source_refs
        - artifact_refs
    handoff_intent: draft-contract-review
    required_profiles:
      - output-style
      - approval-matrix
    required_schemas:
      - contract-review
      - handoff
approval:
  required_before_external_write: true
  required_before_signature_request: true
  required_before_legal_decision: true
output:
  draft_only: true
  provenance_required: true
