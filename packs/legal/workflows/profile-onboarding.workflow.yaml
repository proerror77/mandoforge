id: profile-onboarding
entry_agent: reader
semantic_scopes:
  domain_scope: legal
  workflow_scope: profile-onboarding
  share_policy: isolated
  lane_scope: onboarding
observability:
  expected_events:
    - workflow.run.started
    - workflow.step.started
    - workflow.step.completed
    - workflow.run.completed
  required_evidence:
    - session_events
    - workflow_step_runs
    - context_packet
    - tool_call_refs
    - artifact_refs
    - approval_refs
  budget:
    max_turns: 12
    max_tool_calls: 24
    max_runtime_seconds: 900
    max_cost_usd_micros: 5000000
  failure_policy:
    status_values:
      - completed
      - blocked
      - failed
      - approval_required
    report_fields:
      - completed_steps
      - failed_steps
      - evidence_gaps
      - approval_gaps
      - next_safe_action

outputs:
  - organization
  - legal-playbook
  - approval-matrix
  - connector-map
  - risk-policy
  - output-style
steps:
  - agent: reader
    observability:
      step_key: step-1-reader
      expected_events:
        - workflow.step.started
        - context_packet.generated
        - workflow.step.completed
      required_evidence:
        - context_packet
        - tool_call_refs
        - source_refs
        - artifact_refs
    required_schemas:
      - organization-profile
      - legal-playbook
      - connector-map
    task: collect tenant legal context, approved playbook sources, and connector references
  - agent: analyzer
    observability:
      step_key: step-2-analyzer
      expected_events:
        - workflow.step.started
        - context_packet.generated
        - workflow.step.completed
      required_evidence:
        - context_packet
        - tool_call_refs
        - source_refs
        - artifact_refs
    handoff_intent: normalize-legal-onboarding
    required_schemas:
      - organization-profile
      - legal-playbook
      - approval-matrix
      - connector-map
      - risk-policy
      - output-style
      - handoff
    task: normalize context into governed profile schemas
  - agent: writer
    observability:
      step_key: step-3-writer
      expected_events:
        - workflow.step.started
        - context_packet.generated
        - workflow.step.completed
      required_evidence:
        - context_packet
        - tool_call_refs
        - source_refs
        - artifact_refs
    handoff_intent: draft-legal-profile-assets
    required_schemas:
      - organization-profile
      - legal-playbook
      - approval-matrix
      - connector-map
      - risk-policy
      - output-style
      - handoff
    task: draft tenant profile assets for approval
approval:
  required_before_release: true
  required_before_legal_decision: true
output:
  draft_only: true
  provenance_required: true
