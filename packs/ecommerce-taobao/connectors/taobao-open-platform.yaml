connectors:
  - id: taobao-open-platform
    type: native
    provider: alibaba-top
    base_url: https://eco.taobao.com/router/rest
    adapter_contract:
      adapter_id: taobao-open-platform-adapter
      runtime: native.connector.call
      implementation: mandoforge.native_connectors.alibaba_top.taobao
      live_execution: approval_commit_only
      dry_run_supported: true
      live_runtime:
        enable_env: MANDOFORGE_NATIVE_CONNECTOR_LIVE_ENABLED
        base_url_default: https://eco.taobao.com/router/rest
        secret_source: environment_or_vault_ref
        required_env:
          - TAOBAO_TOP_APP_KEY
          - TAOBAO_TOP_APP_SECRET
          - TAOBAO_TOP_SESSION
    auth:
      type: top-session
      required_secrets:
        - TAOBAO_TOP_APP_KEY
        - TAOBAO_TOP_APP_SECRET
        - TAOBAO_TOP_SESSION
    read_operations:
      - id: order-list-read
        api_name: taobao.trades.sold.get
        permission: taobao.order.read
        object_types: [taobao_order]
        request_contract:
          required_fields: [start_created, end_created, fields]
          optional_fields: [status, page_no, page_size]
        response_contract:
          required_fields: [tid, status, buyer_nick, created, payment, orders]
          evidence_id_field: tid
      - id: item-detail-read
        api_name: taobao.item.seller.get
        permission: taobao.product.read
        object_types: [taobao_product]
        request_contract:
          required_fields: [num_iid, fields]
          optional_fields: [nick]
        response_contract:
          required_fields: [num_iid, title, cid, price, skus]
          evidence_id_field: num_iid
      - id: review-feed-read
        api_name: taobao.traderates.get
        permission: taobao.review.read
        object_types: [taobao_review]
        request_contract:
          required_fields: [start_date, end_date, page_no, page_size]
          optional_fields: [rate_type, result]
        response_contract:
          required_fields: [rate_id, tid, oid, content, result, created]
          evidence_id_field: rate_id
      - id: refund-list-read
        api_name: taobao.refunds.receive.get
        permission: taobao.refund.read
        object_types: [taobao_refund_case]
        request_contract:
          required_fields: [start_modified, end_modified, fields]
          optional_fields: [status, page_no, page_size]
        response_contract:
          required_fields: [refund_id, tid, oid, status, reason, modified]
          evidence_id_field: refund_id
    write_operations:
      - id: review-reply-submit
        api_name: taobao.traderate.explain.add
        permission: taobao.review.reply.write
        approval_required: true
        request_contract:
          required_fields: [oid, tid, reply]
          forbidden_fields: [buyer_phone, buyer_address, raw_private_message]
        response_contract:
          required_fields: [success, request_id]
      - id: refund-agree
        api_name: taobao.rp.refunds.agree
        permission: taobao.refund.action.write
        approval_required: true
        request_contract:
          required_fields: [refund_id, tid, oid]
          optional_fields: [refund_phase, version]
          forbidden_fields: [unsupported_policy_exception, buyer_private_data]
        response_contract:
          required_fields: [success, request_id]
    readiness_probes:
      credential_probe:
        required_secrets: [TAOBAO_TOP_APP_KEY, TAOBAO_TOP_APP_SECRET, TAOBAO_TOP_SESSION]
      tenant_scope_probe:
        required_fields: [tenant_id, workspace_id, shop_id, seller_nick]
      permission_probe:
        sample_read_operations: [order-list-read, item-detail-read, review-feed-read]
    approval_commit_binding:
      required_for_write_operations: true
      bind_fields: [tenant_id, workspace_id, connector_id, api_name, operation_id, object_id, payload_digest, approval_commit_token]
    production_readiness:
      required_evidence_class: customer_grade
      fail_closed_without_evidence: true
      environment_separation:
        sandbox_base_url_env: MANDOFORGE_TAOBAO_TOP_SANDBOX_BASE_URL
        live_base_url_env: MANDOFORGE_TAOBAO_TOP_LIVE_BASE_URL
      token_lifecycle:
        required: true
        controller_env: MANDOFORGE_TAOBAO_TOP_TOKEN_REFRESH_CONTROLLER_URL
      rate_limit_retry:
        required: true
        policy_env: MANDOFORGE_TAOBAO_TOP_RATE_LIMIT_POLICY
        error_taxonomy: [network_timeout, top_service_unavailable, rate_limited]
      idempotency_reconciliation:
        required: true
        controller_env: MANDOFORGE_TAOBAO_TOP_RECONCILIATION_CONTROLLER_URL
        idempotency_fields: [tenant_id, connector_id, operation_id, object_id, payload_digest]
      webhook_ingestion:
        required: true
        endpoint_env: MANDOFORGE_TAOBAO_TOP_WEBHOOK_INGESTION_URL
      compensation:
        required: true
        policy_env: MANDOFORGE_TAOBAO_TOP_COMPENSATION_POLICY
        mode: compensation_or_explicit_non_compensable
      approval_commit_boundary:
        required: true
      secret_redaction:
        required: true
    prompt_injection_boundary:
      treat_results_as_data: true
