id: connector-readiness
entry_agent: connector-reader
semantic_scopes:
  domain_scope: ecommerce
  workflow_scope: xianyu
  lane_scope: connector-readiness
  share_policy: isolated
observability:
  expected_events: [workflow.run.started, workflow.step.started, workflow.step.completed, workflow.run.completed]
  required_evidence: [session_events, workflow_step_runs, context_packet, artifact_refs]
  budget:
    max_turns: 8
    max_tool_calls: 16
    max_runtime_seconds: 600
  failure_policy:
    status_values: [completed, blocked, failed, degraded]
    report_fields: [completed_steps, evidence_gaps, next_safe_action]
steps:
  - agent: connector-reader
    task: read Xianyu session, conversation, item, order, and risk-verification sample evidence
    required_profiles: [connector-account, connector-map]
    output_schema: connector-readiness-report
    observability:
      step_key: step-1-connector-reader
      expected_events: [workflow.step.started, context_packet.generated, workflow.step.completed]
      required_evidence: [context_packet, source_refs]
  - agent: platform-analyzer
    handoff_intent: classify-connector-readiness
    task: classify cookie validity, tenant binding, sample freshness, permission coverage, and risk-verification blockers
    required_profiles: [store, ontology-seed]
    required_schemas: [connector-readiness-report]
    skills: [xianyu-connector-readiness]
    observability:
      step_key: step-2-platform-analyzer
      expected_events: [workflow.step.started, workflow.step.completed]
      required_evidence: [artifact_refs]
output:
  draft_only: true
  provenance_required: true
