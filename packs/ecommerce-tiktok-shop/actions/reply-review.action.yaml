id: reply-review
object_type: tiktok_shop_review
connector_id: tiktok-shop-open-api
operation_id: review-reply-submit
side_effect_class: marketplace_review_write
parameters:
  - name: review_id
    type: ObjectReference<tiktok_shop_review>
    required: true
  - name: reply_text
    type: String
    required: true
validations:
  rules:
    - review belongs to tenant-bound shop_id and region
    - reply_text passes content compliance policy
    - approval payload digest matches review_id, operation_id, and reply_text
effects:
  native_connector_call: native.connector.call
  audit_event: tiktok_shop.action.reply_review
approval:
  approval_required: true
  approver_role: admin
  approval_commit_token_required: true
  payload_digest_required: true
