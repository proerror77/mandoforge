id: connector-readiness
entry_agent: connector-reader
semantic_scopes:
  domain_scope: ecommerce
  workflow_scope: core
  lane_scope: connector-readiness
  share_policy: domain_shared
observability:
  expected_events:
    - workflow.run.started
    - workflow.step.started
    - workflow.step.completed
    - workflow.run.completed
  required_evidence:
    - session_events
    - workflow_step_runs
    - context_packet
    - artifact_refs
  budget:
    max_turns: 8
    max_tool_calls: 16
    max_runtime_seconds: 600
  failure_policy:
    status_values:
      - completed
      - blocked
      - failed
      - approval_required
    report_fields:
      - completed_steps
      - evidence_gaps
      - next_safe_action
steps:
  - agent: connector-reader
    task: read connector account and connector map readiness inputs
    required_profiles:
      - connector-account
      - connector-map
    output_schema: connector-readiness-report
    observability:
      step_key: step-1-connector-reader
      expected_events:
        - workflow.step.started
        - context_packet.generated
        - workflow.step.completed
      required_evidence:
        - context_packet
        - source_refs
  - agent: ontology-analyzer
    handoff_intent: classify-connector-readiness
    task: identify missing credentials, permissions, webhook configuration, and sample-read evidence
    required_profiles:
      - store
      - connector-account
      - ontology-seed
    required_schemas:
      - ontology-seed
    skills:
      - ecommerce-core-readiness
    observability:
      step_key: step-2-ontology-analyzer
      expected_events:
        - workflow.step.started
        - context_packet.generated
        - workflow.step.completed
      required_evidence:
        - context_packet
        - artifact_refs
  - agent: response-writer
    handoff_intent: draft-connector-readiness-report
    task: draft readiness report without exposing raw secret values
    required_profiles:
      - connector-account
      - connector-map
    output_schema: connector-readiness-report
    observability:
      step_key: step-3-response-writer
      expected_events:
        - workflow.step.started
        - workflow.step.completed
      required_evidence:
        - artifact_refs
output:
  draft_only: true
  provenance_required: true
