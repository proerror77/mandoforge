schema_version: workflowpack.mandoforge.dev/v1
kind: DomainPack
id: ecommerce-core
name: Ecommerce Core Ontology Pack
version: 0.1.0
description: Shared ecommerce ontology and connector-readiness template for marketplace workflow packs.
semantic_scopes:
  domain_scope: ecommerce
  workflow_scope: core
  share_policy: domain_shared
  pack_id: ecommerce-core
capabilities:
  - ecommerce-core-readiness
  - ecommerce-core-ontology
profiles:
  - id: default
    path: profiles/default.md
    required: true
  - id: onboarding
    path: profiles/onboarding.md
    required: true
  - id: store
    path: profiles/store.md
    required: true
  - id: connector-account
    path: profiles/connector_account.yaml
    required: true
  - id: connector-map
    path: profiles/connector_map.yaml
    required: true
  - id: ontology-seed
    path: profiles/ontology_seed.yaml
    required: true
skills:
  - id: ecommerce-core-readiness
    path: skills/ecommerce-core-readiness/skill.md
    required: true
workflows:
  - id: connector-readiness
    path: workflows/connector-readiness.workflow.yaml
    entry_agent: connector-reader
agents:
  - id: connector-reader
    path: agents/connector-reader.agent.yaml
    role: reader
    tool_scope:
      read:
        - connector.read
    handoffs:
      - target_agent: ontology-analyzer
        intents:
          - classify-connector-readiness
        risk_level: medium
        approval_required: false
        schema: schemas/handoff.schema.json
  - id: ontology-analyzer
    path: agents/ontology-analyzer.agent.yaml
    role: analyzer
    tool_scope:
      read:
        - profile.read
        - schema.read
    handoffs:
      - target_agent: response-writer
        intents:
          - draft-connector-readiness-report
        risk_level: high
        approval_required: true
        schema: schemas/handoff.schema.json
  - id: response-writer
    path: agents/response-writer.agent.yaml
    role: writer
    tool_scope:
      read:
        - profile.read
      write:
        - artifact.write
connectors:
  - id: ecommerce-reference
    kind: native
    path: connectors/ecommerce-reference.yaml
    required_permissions:
      - ecommerce.reference.read
    writes:
      enabled: false
      approval_required: false
    provenance:
      required: true
    tenant_scope:
      tenant_id: required
      workspace_id: required
    prompt_injection_boundary:
      treat_results_as_data: true
    data_quality:
      min_sample_count: 1
      max_age_hours: 168
      citation_required: true
      required_metadata_fields:
        - platform
        - tenant_id
        - retrieved_at
      required_content_fields:
        - object_type
        - object_id
        - summary
schemas:
  - id: handoff
    path: schemas/handoff.schema.json
    required: true
  - id: store-profile
    path: schemas/store_profile.schema.json
    required: true
  - id: connector-account
    path: schemas/connector_account.schema.json
    required: true
  - id: connector-map
    path: schemas/connector_map.schema.json
    required: true
  - id: ontology-seed
    path: schemas/ontology_seed.schema.json
    required: true
  - id: connector-readiness-report
    path: schemas/connector_readiness_report.schema.json
    required: true
policies:
  - id: approval
    path: policies/approval.yaml
    required: true
  - id: tool-scope
    path: policies/tool_scope.yaml
    required: true
evals:
  - id: ecommerce-core-regression
    path: evals/golden_cases.jsonl
    gate:
      required: true
      min_score: 1.0
release_gates:
  - id: pack-regression
    gate_type: eval
    required: true
  - id: ontology-contract
    gate_type: audit
    required: true
onboarding:
  workflow: connector-readiness
  required_profiles:
    - store
    - connector-account
    - connector-map
    - ontology-seed
  profile_schemas:
    - id: store-profile
      path: schemas/store_profile.schema.json
      required: true
    - id: connector-account
      path: schemas/connector_account.schema.json
      required: true
    - id: connector-map
      path: schemas/connector_map.schema.json
      required: true
    - id: ontology-seed
      path: schemas/ontology_seed.schema.json
      required: true
  eval: ecommerce-core-regression
