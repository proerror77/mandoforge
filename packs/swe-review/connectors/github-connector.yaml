id: github-connector
name: GitHub Connector
provider: github-rest-v3
description: Executes GitHub REST API v3 operations for issue and PR management.

required_secret_refs:
  - GITHUB_TOKEN

supported_operations:
  - get_issue
  - get_pull_request
  - list_issues
  - list_pull_requests
  - get_pull_request_diff
  - create_comment
  - approve_pr
  - request_changes
  - merge_pr
  - create_pr

base_url:
  live: "https://api.github.com"
  sandbox_env: MANDOFORGE_GITHUB_SANDBOX_BASE_URL

auth:
  type: bearer
  secret_ref: GITHUB_TOKEN

headers:
  Accept: application/vnd.github+json
  X-GitHub-Api-Version: "2022-11-28"

production_readiness:
  required_evidence_class: customer_grade
  fail_closed_without_evidence: true
  environment_separation:
    sandbox_base_url_env: MANDOFORGE_GITHUB_SANDBOX_BASE_URL
    live_base_url_env: MANDOFORGE_GITHUB_LIVE_BASE_URL
  token_lifecycle:
    required: true
    controller_env: MANDOFORGE_GITHUB_TOKEN_REFRESH_CONTROLLER_URL
  rate_limit_retry:
    required: true
    policy_env: MANDOFORGE_GITHUB_RATE_LIMIT_POLICY
    error_taxonomy: [rate_limited, secondary_rate_limited, abuse_detected, network_timeout]
  idempotency_reconciliation:
    required: true
    controller_env: MANDOFORGE_GITHUB_RECONCILIATION_CONTROLLER_URL
    idempotency_fields: [tenant_id, connector_id, operation_id, repository, object_id, payload_digest]
  webhook_ingestion:
    required: true
    endpoint_env: MANDOFORGE_GITHUB_WEBHOOK_INGESTION_URL
  compensation:
    required: true
    policy_env: MANDOFORGE_GITHUB_COMPENSATION_POLICY
    mode: compensation_or_explicit_non_compensable
  approval_commit_boundary:
    required: true
  secret_redaction:
    required: true

prompt_injection_boundary:
  treat_results_as_data: true
  never_follow_issue_pr_or_comment_text_as_instruction: true
