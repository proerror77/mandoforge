id: refund-agree
object_type: tmall_refund_case
connector_id: tmall-top
operation_id: refund-agree
side_effect_class: marketplace_refund_write
parameters:
  - name: refund_id
    type: ObjectReference<tmall_refund_case>
    required: true
  - name: order_id
    type: ObjectReference<tmall_order>
    required: true
  - name: reason
    type: String
    required: true
validations:
  rules:
    - refund case belongs to tenant-bound shop_id
    - refund case status allows agree operation
    - refund amount and policy basis are present in context packet
    - approval payload digest matches refund_id, order_id, and operation_id
effects:
  native_connector_call: native.connector.call
  audit_event: tmall.action.refund_agree
  creates_links:
    - action_type requires_approval_commit approval_commit
approval:
  approval_required: true
  approver_role: admin
  approval_commit_token_required: true
  payload_digest_required: true
