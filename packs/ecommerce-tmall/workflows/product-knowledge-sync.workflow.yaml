id: product-knowledge-sync
entry_agent: connector-reader
semantic_scopes:
  domain_scope: ecommerce
  workflow_scope: tmall
  lane_scope: product-knowledge
  share_policy: isolated
observability:
  expected_events:
    - workflow.run.started
    - workflow.step.started
    - workflow.step.completed
    - workflow.run.completed
  required_evidence:
    - session_events
    - workflow_step_runs
    - context_packet
    - tool_call_refs
    - artifact_refs
    - approval_refs
  budget:
    max_turns: 12
    max_tool_calls: 24
    max_runtime_seconds: 900
    max_cost_usd_micros: 5000000
  failure_policy:
    status_values:
      - completed
      - blocked
      - failed
      - approval_required
    report_fields:
      - completed_steps
      - failed_steps
      - evidence_gaps
      - approval_gaps
      - next_safe_action

steps:
  - agent: connector-reader
    observability:
      step_key: step-1-connector-reader
      expected_events:
        - workflow.step.started
        - context_packet.generated
        - workflow.step.completed
      required_evidence:
        - context_packet
        - tool_call_refs
        - source_refs
        - artifact_refs
    task: read item, SKU, media, attribute, FAQ, activity, and policy source data
    output_schema: product-knowledge
  - agent: touchpoint-analyzer
    observability:
      step_key: step-2-touchpoint-analyzer
      expected_events:
        - workflow.step.started
        - context_packet.generated
        - workflow.step.completed
      required_evidence:
        - context_packet
        - tool_call_refs
        - source_refs
        - artifact_refs
    handoff_intent: classify-product-knowledge-gap
    skills:
      - tmall-product-knowledge-sync
output:
  draft_only: true
  provenance_required: true
handoff_rules:
  root_task_grant:
    memory_scope:
      mode: candidate_writeback
      allowed_scope_keys:
        - domain_scope
        - workflow_scope
        - memory_scope
        - share_policy
      allowed_object_types:
        - memory
      allowed_source_types:
        - semantic_synthesis
        - artifact
        - session_event
      allowed_object_ids: []
      minimum_trust_level: source_attested
      max_objects: 25
      approval_memory_allowed: false
      handoff_memory_allowed: false
      writeback_allowed: true
