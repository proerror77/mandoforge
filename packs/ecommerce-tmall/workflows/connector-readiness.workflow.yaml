id: connector-readiness
entry_agent: connector-reader
semantic_scopes:
  domain_scope: ecommerce
  workflow_scope: tmall
  lane_scope: connector-readiness
  share_policy: isolated
observability:
  expected_events:
    - workflow.run.started
    - workflow.step.started
    - workflow.step.completed
    - workflow.run.completed
  required_evidence:
    - session_events
    - workflow_step_runs
    - context_packet
    - tool_call_refs
    - artifact_refs
    - approval_refs
  budget:
    max_turns: 12
    max_tool_calls: 24
    max_runtime_seconds: 900
    max_cost_usd_micros: 5000000
  failure_policy:
    status_values:
      - completed
      - blocked
      - failed
      - approval_required
    report_fields:
      - completed_steps
      - failed_steps
      - evidence_gaps
      - approval_gaps
      - next_safe_action

steps:
  - agent: connector-reader
    observability:
      step_key: step-1-connector-reader
      expected_events:
        - workflow.step.started
        - context_packet.generated
        - workflow.step.completed
      required_evidence:
        - context_packet
        - tool_call_refs
        - source_refs
        - artifact_refs
    task: read tenant connector account binding, secret references, sample probe evidence, and connector operation contracts
    required_profiles:
      - connector-account
      - connector-map
    output_schema: connector-readiness-report
  - agent: touchpoint-analyzer
    observability:
      step_key: step-2-touchpoint-analyzer
      expected_events:
        - workflow.step.started
        - context_packet.generated
        - workflow.step.completed
      required_evidence:
        - context_packet
        - tool_call_refs
        - source_refs
        - artifact_refs
    handoff_intent: classify-connector-readiness
    required_profiles:
      - connector-account
      - connector-map
      - store
    required_schemas:
      - tmall-connector-operation
    skills:
      - tmall-connector-readiness
    output:
      required_fields:
        - credential_status
        - operation_statuses
        - lane_impacts
        - release_blockers
  - agent: response-writer
    observability:
      step_key: step-3-response-writer
      expected_events:
        - workflow.step.started
        - context_packet.generated
        - workflow.step.completed
      required_evidence:
        - context_packet
        - tool_call_refs
        - source_refs
        - artifact_refs
    handoff_intent: draft-connector-readiness-report
    output_schema: connector-readiness-report
    required_profiles:
      - connector-account
      - connector-map
      - output-style
    checks:
      - no_raw_secret_value_rendered
      - blocked_operations_mapped_to_lanes
      - degraded_lanes_explain_manual_fallback
      - external_write_approval_binding_declared
readiness:
  required_before_release: true
  required_before_controlled_external_write: true
output:
  draft_only: true
  provenance_required: true
