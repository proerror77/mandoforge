id: customer-service-conversation
entry_agent: connector-reader
semantic_scopes:
  domain_scope: ecommerce
  workflow_scope: tmall
  lane_scope: customer-service
  share_policy: isolated
observability:
  expected_events:
    - workflow.run.started
    - workflow.step.started
    - workflow.step.completed
    - workflow.run.completed
  required_evidence:
    - session_events
    - workflow_step_runs
    - context_packet
    - tool_call_refs
    - artifact_refs
    - approval_refs
  budget:
    max_turns: 12
    max_tool_calls: 24
    max_runtime_seconds: 900
    max_cost_usd_micros: 5000000
  failure_policy:
    status_values:
      - completed
      - blocked
      - failed
      - approval_required
    report_fields:
      - completed_steps
      - failed_steps
      - evidence_gaps
      - approval_gaps
      - next_safe_action

steps:
  - agent: connector-reader
    observability:
      step_key: step-1-connector-reader
      expected_events:
        - workflow.step.started
        - context_packet.generated
        - workflow.step.completed
      required_evidence:
        - context_packet
        - tool_call_refs
        - source_refs
        - artifact_refs
    task: read customer message, order context, product knowledge, refund state, and relevant policy
    output_schema: order-context
  - agent: touchpoint-analyzer
    observability:
      step_key: step-2-touchpoint-analyzer
      expected_events:
        - workflow.step.started
        - context_packet.generated
        - workflow.step.completed
      required_evidence:
        - context_packet
        - tool_call_refs
        - source_refs
        - artifact_refs
    handoff_intent: classify-customer-service-intent
    required_profiles:
      - service-playbook
      - store
      - risk-policy
    skills:
      - tmall-service-risk-classifier
    output:
      required_fields:
        - intent
        - touchpoint
        - cited_facts
        - missing_facts
        - risk_tier
  - agent: response-writer
    observability:
      step_key: step-3-response-writer
      expected_events:
        - workflow.step.started
        - context_packet.generated
        - workflow.step.completed
      required_evidence:
        - context_packet
        - tool_call_refs
        - source_refs
        - artifact_refs
    handoff_intent: draft-customer-reply
    output_schema: customer-reply-draft
    required_profiles:
      - service-playbook
      - output-style
    skills:
      - tmall-customer-reply-drafter
    checks:
      - no_unsupported_delivery_time
      - no_unsupported_refund_promise
      - no_unsupported_compensation_promise
      - no_unsupported_product_effect
      - cites_policy_or_connector_fact
approval:
  required_before_external_write: true
  required_before_customer_message_send: true
escalation:
  critical_intents:
    - platform_dispute
    - harassment_or_abuse
  high_intents:
    - refund_request
    - return_request
    - complaint
    - logistics_delay
output:
  draft_only: true
  provenance_required: true
