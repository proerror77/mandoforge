id: after-sales-triage
entry_agent: connector-reader
semantic_scopes:
  domain_scope: ecommerce
  workflow_scope: tmall
  lane_scope: after-sales
  share_policy: isolated
observability:
  expected_events:
    - workflow.run.started
    - workflow.step.started
    - workflow.step.completed
    - workflow.run.completed
  required_evidence:
    - session_events
    - workflow_step_runs
    - context_packet
    - tool_call_refs
    - artifact_refs
    - approval_refs
  budget:
    max_turns: 12
    max_tool_calls: 24
    max_runtime_seconds: 900
    max_cost_usd_micros: 5000000
  failure_policy:
    status_values:
      - completed
      - blocked
      - failed
      - approval_required
    report_fields:
      - completed_steps
      - failed_steps
      - evidence_gaps
      - approval_gaps
      - next_safe_action

steps:
  - agent: connector-reader
    observability:
      step_key: step-1-connector-reader
      expected_events:
        - workflow.step.started
        - context_packet.generated
        - workflow.step.completed
      required_evidence:
        - context_packet
        - tool_call_refs
        - source_refs
        - artifact_refs
    task: read refund, return, logistics, order, product, and platform-intervention evidence
    output_schema: after-sales-triage
  - agent: touchpoint-analyzer
    observability:
      step_key: step-2-touchpoint-analyzer
      expected_events:
        - workflow.step.started
        - context_packet.generated
        - workflow.step.completed
      required_evidence:
        - context_packet
        - tool_call_refs
        - source_refs
        - artifact_refs
    handoff_intent: classify-after-sales-risk
    required_profiles:
      - after-sales-playbook
      - approval-matrix
      - risk-policy
    skills:
      - tmall-after-sales-triage
      - tmall-service-risk-classifier
    output:
      required_fields:
        - case_state
        - evidence_checklist
        - evidence_gaps
        - critical_gate
        - risk_tier
  - agent: response-writer
    observability:
      step_key: step-3-response-writer
      expected_events:
        - workflow.step.started
        - context_packet.generated
        - workflow.step.completed
      required_evidence:
        - context_packet
        - tool_call_refs
        - source_refs
        - artifact_refs
    handoff_intent: draft-after-sales-plan
    output_schema: after-sales-triage
    required_profiles:
      - after-sales-playbook
      - service-playbook
      - output-style
    skills:
      - tmall-customer-reply-drafter
      - tmall-after-sales-triage
    output:
      required_fields:
        - recommended_action
        - buyer_facing_draft
        - operator_review_reason
        - external_write_blocked_until_approved
    checks:
      - evidence_gap_summary_present
      - policy_basis_present
      - no_refund_decision_without_approval
      - approval_bind_fields_present
approval:
  required_before_external_write: true
  required_before_refund_agree: true
  required_before_refund_refuse: true
  required_before_returngoods_agree: true
  required_before_returngoods_refuse: true
  required_before_compensation_commitment: true
critical_gates:
  - platform_intervention
  - refund_refuse
  - compensation_commitment
  - counterfeit_or_legal_claim
  - policy_exception
output:
  draft_only: true
  provenance_required: true
