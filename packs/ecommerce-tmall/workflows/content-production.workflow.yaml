id: content-production
entry_agent: connector-reader
semantic_scopes:
  domain_scope: ecommerce
  workflow_scope: tmall
  lane_scope: content-production
  share_policy: isolated
observability:
  expected_events:
    - workflow.run.started
    - workflow.step.started
    - workflow.step.completed
    - workflow.run.completed
  required_evidence:
    - session_events
    - workflow_step_runs
    - context_packet
    - tool_call_refs
    - artifact_refs
    - approval_refs
  budget:
    max_turns: 12
    max_tool_calls: 24
    max_runtime_seconds: 900
    max_cost_usd_micros: 5000000
  failure_policy:
    status_values:
      - completed
      - blocked
      - failed
      - approval_required
    report_fields:
      - completed_steps
      - failed_steps
      - evidence_gaps
      - approval_gaps
      - next_safe_action

steps:
  - agent: connector-reader
    observability:
      step_key: step-1-connector-reader
      expected_events:
        - workflow.step.started
        - context_packet.generated
        - workflow.step.completed
      required_evidence:
        - context_packet
        - tool_call_refs
        - source_refs
        - artifact_refs
    task: read product knowledge, review VOC, customer-service FAQ gaps, after-sales themes, and activity context
    output_schema: content-brief
  - agent: touchpoint-analyzer
    observability:
      step_key: step-2-touchpoint-analyzer
      expected_events:
        - workflow.step.started
        - context_packet.generated
        - workflow.step.completed
      required_evidence:
        - context_packet
        - tool_call_refs
        - source_refs
        - artifact_refs
    handoff_intent: classify-product-knowledge-gap
    required_profiles:
      - content-production-policy
      - review-voc-taxonomy
      - store
    skills:
      - tmall-voc-to-content-brief
    output:
      required_fields:
        - deliverable_type
        - audience
        - sku
        - scene
        - claims
        - evidence_source
  - agent: content-producer
    observability:
      step_key: step-3-content-producer
      expected_events:
        - workflow.step.started
        - context_packet.generated
        - workflow.step.completed
      required_evidence:
        - context_packet
        - tool_call_refs
        - source_refs
        - artifact_refs
    handoff_intent: draft-content-brief
    output_schema: content-brief
    required_profiles:
      - content-production-policy
      - output-style
      - approval-matrix
    skills:
      - tmall-product-image-brief
      - tmall-short-video-script
      - tmall-content-compliance-checker
    output:
      required_fields:
        - handoff_assets
        - compliance_checks
        - approval_owner
    checks:
      - claim_evidence_present
      - prohibited_claims_blocked
      - asset_upload_target_declared
      - media_upload_approval_required
deliverable_lanes:
  images:
    - main_image
    - detail_page_image
    - sku_image
    - review_voc_explainer_image
    - promo_banner
  videos:
    - product_demo_video
    - pain_point_explainer_video
    - comparison_video
    - promo_teaser_video
    - post_sale_usage_guide_video
approval:
  required_before_external_write: true
  required_before_media_upload: true
  required_before_product_media_association: true
  required_before_product_claim_change: true
output:
  draft_only: true
  provenance_required: true
