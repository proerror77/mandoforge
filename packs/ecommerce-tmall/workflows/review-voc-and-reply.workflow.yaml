id: review-voc-and-reply
entry_agent: connector-reader
semantic_scopes:
  domain_scope: ecommerce
  workflow_scope: tmall
  lane_scope: review-voc
  share_policy: isolated
observability:
  expected_events:
    - workflow.run.started
    - workflow.step.started
    - workflow.step.completed
    - workflow.run.completed
  required_evidence:
    - session_events
    - workflow_step_runs
    - context_packet
    - tool_call_refs
    - artifact_refs
    - approval_refs
  budget:
    max_turns: 12
    max_tool_calls: 24
    max_runtime_seconds: 900
    max_cost_usd_micros: 5000000
  failure_policy:
    status_values:
      - completed
      - blocked
      - failed
      - approval_required
    report_fields:
      - completed_steps
      - failed_steps
      - evidence_gaps
      - approval_gaps
      - next_safe_action

steps:
  - agent: connector-reader
    observability:
      step_key: step-1-connector-reader
      expected_events:
        - workflow.step.started
        - context_packet.generated
        - workflow.step.completed
      required_evidence:
        - context_packet
        - tool_call_refs
        - source_refs
        - artifact_refs
    task: read reviews, follow-up reviews, ratings, images, and semantic labels
    output_schema: review-voc
  - agent: touchpoint-analyzer
    observability:
      step_key: step-2-touchpoint-analyzer
      expected_events:
        - workflow.step.started
        - context_packet.generated
        - workflow.step.completed
      required_evidence:
        - context_packet
        - tool_call_refs
        - source_refs
        - artifact_refs
    handoff_intent: classify-review-voc
    required_profiles:
      - review-voc-taxonomy
      - risk-policy
    skills:
      - tmall-review-voc-ingestor
    output:
      required_fields:
        - sentiment
        - themes
        - sample_window
        - sample_count
        - confidence
        - feedback_targets
  - agent: response-writer
    observability:
      step_key: step-3-response-writer
      expected_events:
        - workflow.step.started
        - context_packet.generated
        - workflow.step.completed
      required_evidence:
        - context_packet
        - tool_call_refs
        - source_refs
        - artifact_refs
    handoff_intent: draft-review-explanation
    output_schema: review-reply-draft
    required_profiles:
      - review-voc-taxonomy
      - output-style
    skills:
      - tmall-review-reply-drafter
    checks:
      - factual
      - short
      - non_defensive
      - no_buyer_blame
      - no_private_order_detail
approval:
  required_before_external_write: true
  required_before_review_explanation_submit: true
output:
  draft_only: true
  provenance_required: true
