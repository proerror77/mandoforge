id: question-answer-ops
entry_agent: connector-reader
steps:
  - agent: connector-reader
    task: read Q&A/comment-area question signals and product knowledge, or accept operator-imported question batches when API coverage is unavailable
  - agent: touchpoint-analyzer
    handoff_intent: classify-question-answer-gap
    skills:
      - tmall-question-answer-ops
  - agent: response-writer
    handoff_intent: draft-customer-reply
    output_schema: customer-reply-draft
    skills:
      - tmall-customer-reply-drafter
approval:
  required_before_external_write: true
  required_before_public_answer_submit: true
output:
  draft_only: true
  provenance_required: true
