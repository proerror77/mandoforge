id: negative-review-rescue
entry_agent: connector-reader
semantic_scopes:
  domain_scope: ecommerce
  workflow_scope: tmall
  lane_scope: negative-review-rescue
  share_policy: isolated
observability:
  expected_events:
    - workflow.run.started
    - workflow.step.started
    - workflow.step.completed
    - workflow.run.completed
  required_evidence:
    - session_events
    - workflow_step_runs
    - context_packet
    - tool_call_refs
    - artifact_refs
    - approval_refs
  budget:
    max_turns: 12
    max_tool_calls: 24
    max_runtime_seconds: 900
    max_cost_usd_micros: 5000000
  failure_policy:
    status_values:
      - completed
      - blocked
      - failed
      - approval_required
    report_fields:
      - completed_steps
      - failed_steps
      - evidence_gaps
      - approval_gaps
      - next_safe_action

steps:
  - agent: connector-reader
    observability:
      step_key: step-1-connector-reader
      expected_events:
        - workflow.step.started
        - context_packet.generated
        - workflow.step.completed
      required_evidence:
        - context_packet
        - tool_call_refs
        - source_refs
        - artifact_refs
    task: read negative review, follow-up review, order context, refund status, and product knowledge
    output_schema: review-voc
  - agent: touchpoint-analyzer
    observability:
      step_key: step-2-touchpoint-analyzer
      expected_events:
        - workflow.step.started
        - context_packet.generated
        - workflow.step.completed
      required_evidence:
        - context_packet
        - tool_call_refs
        - source_refs
        - artifact_refs
    handoff_intent: classify-review-voc
    required_profiles:
      - review-voc-taxonomy
      - service-playbook
      - risk-policy
    skills:
      - tmall-review-voc-ingestor
      - tmall-service-risk-classifier
    output:
      required_fields:
        - rescue_state
        - themes
        - urgency
        - root_cause_hypotheses
        - feedback_targets
  - agent: response-writer
    observability:
      step_key: step-3-response-writer
      expected_events:
        - workflow.step.started
        - context_packet.generated
        - workflow.step.completed
      required_evidence:
        - context_packet
        - tool_call_refs
        - source_refs
        - artifact_refs
    handoff_intent: draft-negative-review-rescue-plan
    output_schema: review-reply-draft
    required_profiles:
      - review-voc-taxonomy
      - approval-matrix
      - output-style
    skills:
      - tmall-negative-review-rescue
      - tmall-review-reply-drafter
    output:
      required_sections:
        - merchant_explanation_draft
        - private_recovery_plan
        - internal_root_cause_note
        - follow_up_tracking
    checks:
      - public_private_separation
      - no_buyer_blame
      - no_private_order_detail
      - approval_owner_selected
approval:
  required_before_external_write: true
  required_before_review_explanation_submit: true
  required_before_workorder_create: true
rescue_state_machine:
  states:
    - detected
    - classified
    - public_reply_drafted
    - private_recovery_planned
    - approval_requested
    - follow_up_tracked
output:
  draft_only: true
  provenance_required: true
