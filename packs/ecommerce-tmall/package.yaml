evals:
  - id: ecommerce-tmall-regression
    path: evals/golden_cases.jsonl
    gate:
      required: true
      min_score: 1.0
  - id: profile-onboarding-regression
    path: evals/profile_onboarding_cases.jsonl
    gate:
      required: true
      min_score: 1.0
release_gates:
  - id: pack-regression
    gate_type: eval
    required: true
  - id: approval-policy
    gate_type: policy
    required: true
  - id: connector-readiness
    gate_type: connector_quality
    required: true
  - id: eval-quality-gate
    gate_type: policy
    required: true
  - id: pilot-rollout
    gate_type: policy
    required: true
  - id: observability-bound
    gate_type: audit
    required: true
