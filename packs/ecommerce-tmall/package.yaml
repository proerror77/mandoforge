      required: true
    - id: question-answer-policy
      path: schemas/question_answer_policy.schema.json
      required: true
    - id: review-voc-taxonomy
      path: schemas/review_voc_taxonomy.schema.json
      required: true
    - id: after-sales-playbook
      path: schemas/after_sales_playbook.schema.json
      required: true
    - id: content-production-policy
      path: schemas/content_production_policy.schema.json
      required: true
    - id: observability-contract
      path: schemas/observability_contract.schema.json
      required: true
    - id: pilot-policy
      path: schemas/pilot_policy.schema.json
      required: true
