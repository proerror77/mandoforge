    - observability
    - pilot-policy
  profile_schemas:
    - id: store-profile
      path: schemas/store_profile.schema.json
      required: true
    - id: approval-matrix
      path: schemas/approval_matrix.schema.json
      required: true
    - id: connector-map
      path: schemas/connector_map.schema.json
      required: true
    - id: connector-account
      path: schemas/connector_account.schema.json
      required: true
    - id: ontology-seed
      path: schemas/ontology_seed.schema.json
      required: true
    - id: risk-policy
      path: schemas/risk_policy.schema.json
      required: true
    - id: output-style
      path: schemas/output_style.schema.json
      required: true
    - id: service-playbook
