version: 1
defaults:
  max_turns: 20
  max_tool_calls: 30
  max_runtime_seconds: 600
  max_rows_returned: 500
  max_shell_runtime_seconds: 120
  max_codex_runtime_seconds: 300
blocked_tools:
  - secret.read
  - production_db.write
  - system.network.unrestricted
  - shell.exec.unrestricted
approval_required:
  - tool: shell.exec
    risk: high
  - tool: codex.exec
    risk: high
  - tool: file.write
    risk: medium
  - tool: http.request
    risk: high
allowed_tools:
  generic-orchestrator-agent:
    - file.read
    - file.write
    - sql.get_schema
    - sql.query
    - shell.exec
    - codex.exec
    - approval.request
    - artifact.create
sql_policy:
  default_mode: read_only
  max_rows: 500
  timeout_seconds: 10
  allowed_schemas:
    - generic_demo
  blocked_keywords:
    - INSERT
    - UPDATE
    - DELETE
    - DROP
    - ALTER
    - CREATE
    - TRUNCATE
    - GRANT
    - REVOKE
    - COPY
    - CALL
    - DO
sandbox_policy:
  default_mode: workspace_write
  network: disabled
  allow_host_mounts: false
  allow_secret_mounts: false
