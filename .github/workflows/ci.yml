name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  static:
    name: Static gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/trunk
            web-ui/target
          key: static-yew-${{ runner.os }}-${{ hashFiles('web-ui/Cargo.lock') }}
          restore-keys: |
            static-yew-${{ runner.os }}-
      - name: Install kubectl
        run: |
          KUBECTL_VERSION="$(curl -fsSL https://dl.k8s.io/release/stable.txt)"
          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
      - name: Install Trunk
        run: |
          if ! command -v trunk >/dev/null 2>&1; then
            cargo install trunk --locked --version 0.21.14
          fi
      - name: Build web UI
        run: |
          cd web-ui
          trunk build --release --dist ../web
      - name: Check JavaScript syntax
        run: |
          node --check scripts/stage2-mock-controller.js
      - run: scripts/verify-static-ui-assets.sh
      - run: node scripts/verify-ui-api-truth-gate.mjs
      - run: STATIC_ONLY=1 scripts/ontology-release-workflow-trigger-gate.sh
      - run: STATIC_ONLY=1 scripts/product-surfaces-production-gate.sh
      - run: STATIC_ONLY=1 scripts/production-launch-preflight.sh
      - name: Check shell syntax
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -maxdepth 1 -type f -name '*.sh' -print0 | sort -z)
      - run: scripts/verify-whiskey-evidence-auth-fallbacks.sh
      - run: scripts/verify-whiskey-eval-release-seed.sh
      - run: scripts/verify-workflow-pack-connector-quality-seed.sh
      - run: scripts/verify-observability-k8s-manifests.sh
      - run: scripts/verify-remote-computer-k8s-manifests.sh
      - run: scripts/verify-stage2-evidence-k8s-manifests.sh
      - run: kubectl kustomize deploy/k8s >/tmp/mandoforge-kustomize.out && wc -l /tmp/mandoforge-kustomize.out

  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            cargo-${{ runner.os }}-
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - run: cargo fetch --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo test --workspace --locked --all-targets -- --test-threads=1
      - run: scripts/verify-workflow-pack-manifest.sh
      - name: Agent OS core evidence gate
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p mandoforge-api --bin mandoforge-api --locked
          LOG_FILE="$(mktemp -t mandoforge-agent-os-core-ci.XXXXXX.log)"
          MANDOFORGE_ADDR=127.0.0.1:8787 \
            MANDOFORGE_WORKSPACE_ROOT=.mandoforge/ci-agent-os-core-workspaces \
            MANDOFORGE_INSECURE_DEV_AUTH=1 \
            MANDOFORGE_ALLOW_IN_MEMORY_STORE=1 \
            MANDOFORGE_ALLOW_HOST_SHELL_EXEC=1 \
            target/debug/mandoforge-api >"$LOG_FILE" 2>&1 &
          API_PID="$!"
          trap 'kill "$API_PID" >/dev/null 2>&1 || true; wait "$API_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8787/healthz >/dev/null 2>&1; then
              BASE_URL=http://127.0.0.1:8787 \
                MANDOFORGE_WORKSPACE_ROOT=.mandoforge/ci-agent-os-core-workspaces \
                ./scripts/agent-os-core-evidence-gate.sh
              exit 0
            fi
            if ! kill -0 "$API_PID" >/dev/null 2>&1; then
              cat "$LOG_FILE" >&2
              exit 1
            fi
            sleep 0.5
          done
          cat "$LOG_FILE" >&2
          exit 1
