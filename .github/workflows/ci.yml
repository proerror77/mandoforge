name: CI

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install kubectl
        run: |
          KUBECTL_VERSION="$(curl -fsSL https://dl.k8s.io/release/stable.txt)"
          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - run: cargo test -p mandoforge-api
      - run: node --check web/app.js
      - run: bash -n scripts/stage1-final-gate.sh
      - run: bash -n scripts/stage2-production-evidence-gate.sh
      - run: bash -n scripts/verify-stage2-controller-env-template.sh
      - run: bash -n scripts/verify-stage2-evidence-k8s-manifests.sh
      - run: scripts/verify-stage2-controller-env-template.sh
      - run: scripts/verify-stage2-evidence-k8s-manifests.sh
      - run: kubectl kustomize deploy/k8s >/tmp/mandoforge-kustomize.out && wc -l /tmp/mandoforge-kustomize.out
      - run: kubectl kustomize deploy/stage2-evidence >/tmp/mandoforge-stage2-evidence-kustomize.out && wc -l /tmp/mandoforge-stage2-evidence-kustomize.out
