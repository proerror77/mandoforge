name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to build
        required: true
        default: manual
      publish_image:
        description: Push the built image to GHCR
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/mandoforge-api

jobs:
  build-image:
    name: Build deploy image
    runs-on: ubuntu-latest
    environment: stage2-production
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -t "$IMAGE_NAME:${{ inputs.image_tag }}" .
      - name: Login to GHCR
        if: inputs.publish_image == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push image
        if: inputs.publish_image == 'true'
        run: docker push "$IMAGE_NAME:${{ inputs.image_tag }}"
