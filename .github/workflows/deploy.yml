name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to build
        required: true
        default: manual
      runtime_image_tag:
        description: Agent Sandbox runtime image tag
        required: true
        default: 0.1.5
      runtime_only:
        description: Build and publish only the Agent Sandbox runtime image
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      publish_image:
        description: Push the built image to GHCR
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      deploy_whiskey:
        description: SSH to Whiskey and restart the adoption stack with this image
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      whiskey_remote_host:
        description: Whiskey SSH host or IP; falls back to WHISKEY_REMOTE_HOST secret
        required: false
        default: ""
      whiskey_remote_user:
        description: Whiskey SSH user; falls back to WHISKEY_REMOTE_USER secret, then root
        required: false
        default: ""
      whiskey_remote_root:
        description: Whiskey deployment root
        required: false
        default: /opt/mandoforge-adoption

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/mandoforge-api
  RUNTIME_IMAGE_NAME: ghcr.io/${{ github.repository }}/mandoforge-agent-sandbox-runtime

jobs:
  build-image:
    name: Build deploy image
    runs-on: ubuntu-latest
    environment: stage2-production
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      RUNTIME_IMAGE_TAG: ${{ inputs.runtime_image_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate image tags
        run: |
          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]
          [[ "$RUNTIME_IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]
      - name: Build Agent Sandbox runtime image
        run: MANDOFORGE_AGENT_SANDBOX_IMAGE="$RUNTIME_IMAGE_NAME:$RUNTIME_IMAGE_TAG" scripts/build-agent-sandbox-runtime-image.sh --platform linux/amd64
      - uses: dtolnay/rust-toolchain@stable
        if: inputs.runtime_only != 'true'
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        if: inputs.runtime_only != 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/trunk
            target
            web-ui/target
          key: deploy-yew-${{ runner.os }}-${{ hashFiles('web-ui/Cargo.toml') }}
          restore-keys: |
            deploy-yew-${{ runner.os }}-
      - name: Install Trunk
        if: inputs.runtime_only != 'true'
        run: |
          if ! command -v trunk >/dev/null 2>&1; then
            cargo install trunk --locked --version 0.21.14
          fi
      - name: Build web UI
        if: inputs.runtime_only != 'true'
        run: |
          cd web-ui
          trunk build --release --dist ../web
          cd ..
          scripts/verify-static-ui-assets.sh
      - name: Build image
        if: inputs.runtime_only != 'true'
        run: |
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "MANDOFORGE_BUILD_TIME=$build_time" >> "$GITHUB_ENV"
          docker build \
            --platform linux/amd64 \
            --build-arg MANDOFORGE_IMAGE_TAG="$IMAGE_TAG" \
            --build-arg MANDOFORGE_GIT_SHA="${{ github.sha }}" \
            --build-arg MANDOFORGE_BUILD_TIME="$build_time" \
            -t "$IMAGE_NAME:$IMAGE_TAG" \
            .
      - name: Login to GHCR
        if: inputs.runtime_only == 'true' || inputs.publish_image == 'true' || inputs.deploy_whiskey == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
      - name: Push image
        if: inputs.runtime_only != 'true' && (inputs.publish_image == 'true' || inputs.deploy_whiskey == 'true')
        run: docker push "$IMAGE_NAME:$IMAGE_TAG"
      - name: Push Agent Sandbox runtime image
        if: inputs.runtime_only == 'true' || inputs.publish_image == 'true'
        run: docker push "$RUNTIME_IMAGE_NAME:$RUNTIME_IMAGE_TAG"
      - name: Deploy Whiskey
        if: inputs.runtime_only != 'true' && inputs.deploy_whiskey == 'true'
        env:
          INPUT_WHISKEY_REMOTE_HOST: ${{ inputs.whiskey_remote_host }}
          INPUT_WHISKEY_REMOTE_USER: ${{ inputs.whiskey_remote_user }}
          INPUT_WHISKEY_REMOTE_ROOT: ${{ inputs.whiskey_remote_root }}
          SECRET_WHISKEY_REMOTE_HOST: ${{ secrets.WHISKEY_REMOTE_HOST }}
          SECRET_WHISKEY_REMOTE_USER: ${{ secrets.WHISKEY_REMOTE_USER }}
          WHISKEY_SSH_PRIVATE_KEY: ${{ secrets.WHISKEY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          remote_host="${INPUT_WHISKEY_REMOTE_HOST:-$SECRET_WHISKEY_REMOTE_HOST}"
          remote_user="${INPUT_WHISKEY_REMOTE_USER:-${SECRET_WHISKEY_REMOTE_USER:-root}}"
          remote_root="${INPUT_WHISKEY_REMOTE_ROOT:-/opt/mandoforge-adoption}"

          if [[ -z "$remote_host" ]]; then
            echo "Whiskey deploy requires workflow input whiskey_remote_host or secret WHISKEY_REMOTE_HOST" >&2
            exit 1
          fi
          if [[ -z "${WHISKEY_SSH_PRIVATE_KEY:-}" ]]; then
            echo "Whiskey deploy requires secret WHISKEY_SSH_PRIVATE_KEY" >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$WHISKEY_SSH_PRIVATE_KEY" > ~/.ssh/whiskey_deploy_key
          chmod 600 ~/.ssh/whiskey_deploy_key
          ssh-keyscan -H "$remote_host" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host whiskey-ci
            HostName $remote_host
            User $remote_user
            IdentityFile ~/.ssh/whiskey_deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

          WHISKEY_REMOTE_HOST=whiskey-ci \
            WHISKEY_REMOTE_ROOT="$remote_root" \
            MANDOFORGE_IMAGE_TAG="$IMAGE_TAG" \
            MANDOFORGE_GIT_SHA="${{ github.sha }}" \
            MANDOFORGE_BUILD_TIME="${MANDOFORGE_BUILD_TIME:-}" \
            scripts/whiskey-adoption-deploy.sh

          version_json="$(ssh whiskey-ci "cd '$remote_root' && set -a && source whiskey.env && set +a && curl -fsS http://127.0.0.1:\${MANDOFORGE_API_HOST_PORT:-18787}/api/deployment/version")"
          actual_tag="$(jq -r '.image_tag // empty' <<<"$version_json")"
          if [[ "$actual_tag" != "$IMAGE_TAG" ]]; then
            echo "Whiskey is not running the requested image tag: expected $IMAGE_TAG, got ${actual_tag:-missing}" >&2
            echo "$version_json" >&2
            exit 1
          fi
          echo "$version_json"
