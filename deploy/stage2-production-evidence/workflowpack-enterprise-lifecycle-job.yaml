apiVersion: batch/v1
kind: Job
metadata:
  name: mandoforge-workflowpack-enterprise-lifecycle
  labels:
    app.kubernetes.io/name: mandoforge
    app.kubernetes.io/component: workflowpack-enterprise-lifecycle
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mandoforge
        app.kubernetes.io/component: workflowpack-enterprise-lifecycle
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: workflowpack-enterprise-lifecycle
          image: mandoforge-api:latest
          imagePullPolicy: IfNotPresent
          command:
            - /app/scripts/workflowpack-enterprise-lifecycle-gate.sh
          envFrom:
            - secretRef:
                name: mandoforge-stage2-controller-env
          env:
            - name: EVIDENCE_DIR
              value: /evidence/workflowpack-enterprise-lifecycle-gate
            - name: SOURCE_EVIDENCE_DIR
              value: /evidence
            - name: WORKFLOWPACK_ENTERPRISE_LIFECYCLE_EVIDENCE_FILE
              value: /evidence/workflowpack-enterprise-lifecycle/summary.json
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: evidence
              mountPath: /evidence
      volumes:
        - name: evidence
          persistentVolumeClaim:
            claimName: mandoforge-stage2-production-evidence
