apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mandoforge-workspaces
spec:
  accessModes:
    - ReadWriteMany
  # The API and dedicated worker role both mount this claim, so production must
  # use an RWX-capable shared filesystem instead of a single-node block volume.
  # Use a storage class backed by shared storage such as EFS/NFS/JuiceFS/CephFS.
  storageClassName: mandoforge-shared-workspaces-rwx
  resources:
    requests:
      storage: 50Gi
