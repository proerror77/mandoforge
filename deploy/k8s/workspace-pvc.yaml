apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mandoforge-workspaces
spec:
  accessModes:
    - ReadWriteOnce
  # storageClassName must be explicitly set for production to avoid relying on the
  # cluster default (which may be HDD or non-replicated local storage).
  # Set to a suitable class for your cloud provider, e.g. "gp3" for AWS EKS.
  # If multiple API replicas are required, switch accessModes to ReadWriteMany
  # and use a storageClassName that supports it (e.g. EFS/NFS/JuiceFS).
  storageClassName: gp3
  resources:
    requests:
      storage: 50Gi
