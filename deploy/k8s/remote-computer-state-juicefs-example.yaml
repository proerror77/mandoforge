apiVersion: v1
kind: Secret
metadata:
  name: mandoforge-remote-computer-juicefs
stringData:
  name: mandoforge-agent-state
  metaurl: redis://redis:6379/1
  storage: s3
  bucket: https://s3.example.com/mandoforge-agent-state
  access-key: replace-me
  secret-key: replace-me
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mandoforge-remote-computer-juicefs-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: csi.juicefs.com
    volumeHandle: mandoforge-agent-state
    nodePublishSecretRef:
      name: mandoforge-remote-computer-juicefs
      namespace: default
    volumeAttributes:
      subPath: mandoforge/agent-state
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mandoforge-remote-computer-state-juicefs
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
  volumeName: mandoforge-remote-computer-juicefs-pv
