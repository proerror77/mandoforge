apiVersion: apps/v1
kind: Deployment
metadata:
  name: mandoforge-agent-remote-computer-warm-pool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mandoforge-agent-remote-computer
      pool: warm
  template:
    metadata:
      labels:
        app: mandoforge-agent-remote-computer
        pool: warm
    spec:
      serviceAccountName: mandoforge-remote-computer
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: remote-computer
          image: mandoforge-adoption-api:latest
          imagePullPolicy: IfNotPresent
          command: ["sleep", "infinity"]
          env:
            - name: MANDOFORGE_REMOTE_COMPUTER_MODE
              value: "warm-pool-skeleton"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: state
              mountPath: /agent-state
            - name: state-contract
              mountPath: /agent-state/.mandoforge/contract
              readOnly: true
            - name: workspace
              mountPath: /workspace
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
        - name: artifact-discovery
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/opt/mandoforge/discover-artifacts.py"]
          env:
            - name: MANDOFORGE_ARTIFACT_DISCOVERY_ENABLED
              value: "false"
            - name: MANDOFORGE_API_URL
              value: "http://mandoforge-api:8787"
            - name: MANDOFORGE_ARTIFACT_DIR
              value: "/workspace/artifacts"
            - name: MANDOFORGE_ARTIFACT_DISCOVERY_INTERVAL_SECONDS
              value: "30"
            - name: MANDOFORGE_ARTIFACT_DISCOVERY_MAX_FILES
              value: "50"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: workspace
              mountPath: /workspace
              readOnly: true
            - name: artifact-discovery
              mountPath: /opt/mandoforge
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: mandoforge-remote-computer-state
        - name: state-contract
          configMap:
            name: mandoforge-remote-computer-state-contract
        - name: workspace
          emptyDir: {}
        - name: artifact-discovery
          configMap:
            name: mandoforge-remote-computer-artifact-discovery
