apiVersion: v1
kind: ConfigMap
metadata:
  name: mandoforge-config
data:
  MANDOFORGE_ADDR: "0.0.0.0:8787"
  MANDOFORGE_TENANT_ID: "00000000-0000-4000-8000-000000000001"
  MANDOFORGE_TENANT_ROUTING_MODE: "single_runtime_tenant"
  MANDOFORGE_WORKSPACE_ROOT: "/var/lib/mandoforge/workspaces"
  MANDOFORGE_ENTERPRISE_PRODUCT_EVIDENCE_DIR: "/evidence"
  MANDOFORGE_PROVIDER_RUNTIME_ENV: "production"
  MANDOFORGE_AGENT_RELEASE_ENVIRONMENT: "production"
  MANDOFORGE_AGENT_RELEASE_ENFORCEMENT: "required"
  MANDOFORGE_AGENT_RELEASE_CONTROLLER_REQUIRED: "true"
  MANDOFORGE_AGENT_RELEASE_DEPLOYMENT_CONTROLLER_REQUIRED: "true"
  MANDOFORGE_AGENT_RELEASE_ORCHESTRATION_CONTROLLER_REQUIRED: "true"
  MANDOFORGE_AGENT_RELEASE_ROLLBACK_CONTROLLER_REQUIRED: "true"
  MANDOFORGE_EXECUTION_WORKER: "queue"
  MANDOFORGE_REMOTE_COMPUTER_RUNNER: "agent-sandbox"
  MANDOFORGE_REMOTE_COMPUTER_EXECUTION_TRANSPORT: "kubernetes"
  MANDOFORGE_REMOTE_COMPUTER_EXECUTION_ENABLED: "false"
  MANDOFORGE_REMOTE_COMPUTER_MUTATION_ENABLED: "false"
  MANDOFORGE_REMOTE_COMPUTER_LIVE_MUTATION_ENABLED: "false"
  MANDOFORGE_REMOTE_COMPUTER_NAMESPACE: "agent-os"
  MANDOFORGE_REMOTE_COMPUTER_SERVICE_ACCOUNT: "mandoforge-remote-computer"
  MANDOFORGE_REMOTE_COMPUTER_TEMPLATE_PATH: "deploy/k8s/agent-sandbox-runtime.yaml"
  MANDOFORGE_REMOTE_COMPUTER_KUBE_API_URL: "https://kubernetes.default.svc"
  MANDOFORGE_REMOTE_COMPUTER_BEARER_TOKEN_PATH: "/var/run/secrets/kubernetes.io/serviceaccount/token"
  MANDOFORGE_REMOTE_COMPUTER_IN_CLUSTER: "true"
  MANDOFORGE_REMOTE_COMPUTER_WARM_POOL: "true"
  MANDOFORGE_AGENT_SANDBOX_WARM_POOL: "mandoforge-agent-runtime"
  MANDOFORGE_AGENT_SANDBOX_TTL_SECONDS: "1800"
  MANDOFORGE_SERVICE_NAME: "mandoforge-api"
  MANDOFORGE_OTEL_EXPORTER_OTLP_ENDPOINT: "http://mandoforge-otel-collector:4318"
  MANDOFORGE_OTEL_COLLECTOR_HEALTH_ENDPOINT: "http://mandoforge-otel-collector:13133/healthz"
  RUST_LOG: "info"
