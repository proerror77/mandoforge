apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mandoforge-worker-restricted
spec:
  podSelector:
    matchLabels:
      app: mandoforge-worker
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: mandoforge-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: mandoforge-otel-collector
      ports:
        - protocol: TCP
          port: 4318
        - protocol: TCP
          port: 13133
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
