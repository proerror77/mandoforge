apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mandoforge-otel-collector
spec:
  podSelector:
    matchLabels:
      app: mandoforge-otel-collector
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: mandoforge-api
        - podSelector:
            matchLabels:
              app: mandoforge-worker
        - podSelector:
            matchLabels:
              app: mandoforge-worker-isolated
      ports:
        - protocol: TCP
          port: 4318
        - protocol: TCP
          port: 13133
