apiVersion: v1
kind: ConfigMap
metadata:
  name: mandoforge-secret-delivery-contract
data:
  MANDOFORGE_SECRET_DELIVERY_REQUIRED: "true"
  MANDOFORGE_SECRET_NAME: "mandoforge-secrets"
  MANDOFORGE_SECRET_DELIVERY_METHOD: "external-secret-manager-or-sealedsecret"
  MANDOFORGE_SECRET_MUST_NOT_BE_EXAMPLE: "true"
  MANDOFORGE_SECRET_REQUIRED_KEYS: "DATABASE_URL,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,MANDOFORGE_DEV_ADMIN_TOKEN,MANDOFORGE_WORKER_TOKEN,MANDOFORGE_SCHEDULER_SUBJECT,MANDOFORGE_SCHEDULER_ROLES,MANDOFORGE_SCHEDULER_TOKEN"
  MANDOFORGE_WORKER_SECRET_NAME: "mandoforge-worker-secrets"
  MANDOFORGE_WORKER_SECRET_REQUIRED_KEYS: "DATABASE_URL,MANDOFORGE_WORKER_TOKEN"
  MANDOFORGE_WORKER_SECRET_ALLOWED_KEYS: "DATABASE_URL,MANDOFORGE_WORKER_TOKEN,MANDOFORGE_PROVIDER_API_KEY,DEEPSEEK_API_KEY,MANDOFORGE_VAULT_TOKEN"
