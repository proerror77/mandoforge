apiVersion: apps/v1
kind: Deployment
metadata:
  name: mandoforge-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mandoforge-worker
  template:
    metadata:
      labels:
        app: mandoforge-worker
    spec:
      serviceAccountName: mandoforge-worker
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/proerror77/mandoforge/mandoforge-api:latest
          imagePullPolicy: IfNotPresent
          command: ["mandoforge-api"]
          envFrom:
            - configMapRef:
                name: mandoforge-config
            - secretRef:
                name: mandoforge-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: MANDOFORGE_PROCESS_ROLE
              value: "worker"
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POLL_INTERVAL_SECONDS
              value: "2"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "500m"
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: workspaces
              mountPath: /var/lib/mandoforge/workspaces
      volumes:
        - name: tmp
          emptyDir: {}
        - name: workspaces
          persistentVolumeClaim:
            claimName: mandoforge-workspaces
