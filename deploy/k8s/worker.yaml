apiVersion: apps/v1
kind: Deployment
metadata:
  name: mandoforge-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mandoforge-worker
  template:
    metadata:
      labels:
        app: mandoforge-worker
    spec:
      serviceAccountName: mandoforge-worker
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/proerror77/mandoforge/mandoforge-api:latest
          imagePullPolicy: IfNotPresent
          command: ["mandoforge-worker"]
          envFrom:
            - configMapRef:
                name: mandoforge-config
            - secretRef:
                name: mandoforge-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: BASE_URL
              value: "http://mandoforge-api:8787"
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POLL_INTERVAL_SECONDS
              value: "2"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "500m"
              memory: 256Mi
          volumeMounts:
            - name: kube-api-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: kube-api-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: https://kubernetes.default.svc
                  expirationSeconds: 3600
        - name: tmp
          emptyDir: {}
