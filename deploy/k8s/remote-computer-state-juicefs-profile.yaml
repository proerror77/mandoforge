apiVersion: v1
kind: Secret
metadata:
  name: mandoforge-remote-computer-juicefs
  annotations:
    mandoforge.io/profile: remote-computer-state
    mandoforge.io/provider: juicefs
type: Opaque
stringData:
  name: mandoforge-agent-state
  metaurl: redis://replace-me:6379/1
  storage: s3
  bucket: https://s3.example.com/mandoforge-agent-state
  access-key: replace-me
  secret-key: replace-me
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mandoforge-remote-computer-state-juicefs-pv
  annotations:
    mandoforge.io/profile: remote-computer-state
    mandoforge.io/provider: juicefs
spec:
  storageClassName: ""
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: csi.juicefs.com
    volumeHandle: mandoforge-agent-state
    nodePublishSecretRef:
      name: mandoforge-remote-computer-juicefs
      namespace: agent-os
    volumeAttributes:
      subPath: mandoforge/agent-state
