apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mandoforge-worker-remote-computer
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mandoforge-worker-remote-computer
subjects:
  - kind: ServiceAccount
    name: mandoforge-worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mandoforge-worker-remote-computer
