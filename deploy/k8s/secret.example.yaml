apiVersion: v1
kind: Secret
metadata:
  name: mandoforge-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgres://mandoforge:replace-with-random-postgres-password@mandoforge-postgres:5432/mandoforge"
  POSTGRES_USER: "mandoforge"
  POSTGRES_PASSWORD: "replace-with-random-postgres-password"
  POSTGRES_DB: "mandoforge"
  MANDOFORGE_DEV_ADMIN_TOKEN: "replace-with-random-evidence-admin-token"
  MANDOFORGE_WORKER_TOKEN: "replace-with-random-worker-token"
  MANDOFORGE_SCHEDULER_SUBJECT: "scheduler"
  MANDOFORGE_SCHEDULER_ROLES: "admin"
  MANDOFORGE_SCHEDULER_TOKEN: "replace-with-random-shared-token"
