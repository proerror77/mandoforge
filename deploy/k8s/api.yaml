apiVersion: v1
kind: Service
metadata:
  name: mandoforge-api
spec:
  selector:
    app: mandoforge-api
  ports:
    - name: http
      port: 8787
      targetPort: 8787
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mandoforge-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mandoforge-api
  template:
    metadata:
      labels:
        app: mandoforge-api
    spec:
      serviceAccountName: mandoforge-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: ghcr.io/proerror77/mandoforge/mandoforge-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8787
          envFrom:
            - configMapRef:
                name: mandoforge-config
            - configMapRef:
                name: mandoforge-agent-sandbox-controller-contract
            - secretRef:
                name: mandoforge-secrets
          volumeMounts:
            - name: kube-api-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: workspaces
              mountPath: /var/lib/mandoforge/workspaces
            - name: stage2-production-evidence
              mountPath: /evidence
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: kube-api-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        - name: workspaces
          persistentVolumeClaim:
            claimName: mandoforge-workspaces
        - name: stage2-production-evidence
          persistentVolumeClaim:
            claimName: mandoforge-stage2-production-evidence
