services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mandoforge
      POSTGRES_PASSWORD: ${MANDOFORGE_POSTGRES_PASSWORD:-mandoforge}
      POSTGRES_DB: mandoforge
    ports:
      - "127.0.0.1:${MANDOFORGE_POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandoforge -d mandoforge"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ${MANDOFORGE_IMAGE:-ghcr.io/proerror77/mandoforge/mandoforge-api:${MANDOFORGE_IMAGE_TAG:-latest}}
    environment:
      MANDOFORGE_ADDR: 0.0.0.0:8787
      MANDOFORGE_WORKSPACE_ROOT: /var/lib/mandoforge/workspaces
      MANDOFORGE_MIGRATIONS_DIR: /app/db/migrations
      DATABASE_URL: postgres://mandoforge:${MANDOFORGE_POSTGRES_PASSWORD:-mandoforge}@postgres:5432/mandoforge
      MANDOFORGE_EXECUTION_WORKER: ${MANDOFORGE_EXECUTION_WORKER:-queue}
      MANDOFORGE_SCHEDULER_TOKEN: ${MANDOFORGE_SCHEDULER_TOKEN:-whiskey-stage2-scheduler-token}
      MANDOFORGE_PROVIDER_BASE_URL: ${MANDOFORGE_PROVIDER_BASE_URL:-}
      MANDOFORGE_PROVIDER_API_KEY: ${MANDOFORGE_PROVIDER_API_KEY:-}
      MANDOFORGE_PROVIDER_MODEL: ${MANDOFORGE_PROVIDER_MODEL:-gpt-5.4-mini}
      MANDOFORGE_PROVIDER_DEPLOYMENT_CONTROLLER_REQUIRED: ${MANDOFORGE_PROVIDER_DEPLOYMENT_CONTROLLER_REQUIRED:-false}
      MANDOFORGE_PROVIDER_DEPLOYMENT_CONTROLLER_URL: ${MANDOFORGE_PROVIDER_DEPLOYMENT_CONTROLLER_URL:-}
      MANDOFORGE_PROVIDER_DEPLOYMENT_CONTROLLER_TOKEN: ${MANDOFORGE_PROVIDER_DEPLOYMENT_CONTROLLER_TOKEN:-}
      MANDOFORGE_PROVIDER_DEPLOYMENT_TIMEOUT_SECONDS: ${MANDOFORGE_PROVIDER_DEPLOYMENT_TIMEOUT_SECONDS:-15}
      MANDOFORGE_PROVIDER_ROLLOUT_CONTROLLER_URL: ${MANDOFORGE_PROVIDER_ROLLOUT_CONTROLLER_URL:-}
      MANDOFORGE_PROVIDER_ROLLOUT_TOKEN: ${MANDOFORGE_PROVIDER_ROLLOUT_TOKEN:-}
      MANDOFORGE_PROVIDER_ROLLOUT_TIMEOUT_SECONDS: ${MANDOFORGE_PROVIDER_ROLLOUT_TIMEOUT_SECONDS:-15}
      MANDOFORGE_PROVIDER_ROLLOUT_ROLLBACK_CONTROLLER_URL: ${MANDOFORGE_PROVIDER_ROLLOUT_ROLLBACK_CONTROLLER_URL:-}
      MANDOFORGE_PROVIDER_ROLLOUT_ROLLBACK_TOKEN: ${MANDOFORGE_PROVIDER_ROLLOUT_ROLLBACK_TOKEN:-}
      MANDOFORGE_PROVIDER_ROLLOUT_ROLLBACK_TIMEOUT_SECONDS: ${MANDOFORGE_PROVIDER_ROLLOUT_ROLLBACK_TIMEOUT_SECONDS:-15}
      MANDOFORGE_SHELL_RUNNER: ${MANDOFORGE_SHELL_RUNNER:-host}
      MANDOFORGE_SERVICE_NAME: ${MANDOFORGE_SERVICE_NAME:-mandoforge-api}
      MANDOFORGE_OTEL_EXPORTER_OTLP_ENDPOINT: ${MANDOFORGE_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      MANDOFORGE_OTEL_COLLECTOR_HEALTH_ENDPOINT: ${MANDOFORGE_OTEL_COLLECTOR_HEALTH_ENDPOINT:-}
      MANDOFORGE_OTEL_SAMPLE_RATIO: ${MANDOFORGE_OTEL_SAMPLE_RATIO:-1.0}
      MANDOFORGE_CODEX_APP_SERVER_URL: ${MANDOFORGE_CODEX_APP_SERVER_URL:-}
      MANDOFORGE_CODEX_APP_SERVER_DEPLOYMENT_CONTROLLER_REQUIRED: ${MANDOFORGE_CODEX_APP_SERVER_DEPLOYMENT_CONTROLLER_REQUIRED:-false}
      MANDOFORGE_CODEX_APP_SERVER_DEPLOYMENT_CONTROLLER_URL: ${MANDOFORGE_CODEX_APP_SERVER_DEPLOYMENT_CONTROLLER_URL:-}
      MANDOFORGE_CODEX_APP_SERVER_DEPLOYMENT_CONTROLLER_TOKEN: ${MANDOFORGE_CODEX_APP_SERVER_DEPLOYMENT_CONTROLLER_TOKEN:-}
      MANDOFORGE_CODEX_APP_SERVER_OPS_CONTROLLER_REQUIRED: ${MANDOFORGE_CODEX_APP_SERVER_OPS_CONTROLLER_REQUIRED:-false}
      MANDOFORGE_CODEX_APP_SERVER_OPS_CONTROLLER_URL: ${MANDOFORGE_CODEX_APP_SERVER_OPS_CONTROLLER_URL:-}
      MANDOFORGE_CODEX_APP_SERVER_OPS_CONTROLLER_TOKEN: ${MANDOFORGE_CODEX_APP_SERVER_OPS_CONTROLLER_TOKEN:-}
      MANDOFORGE_APPROVAL_WEBHOOK_URL: ${MANDOFORGE_APPROVAL_WEBHOOK_URL:-}
      MANDOFORGE_APPROVAL_NOTIFICATION_DEPLOYMENT_CONTROLLER_REQUIRED: ${MANDOFORGE_APPROVAL_NOTIFICATION_DEPLOYMENT_CONTROLLER_REQUIRED:-false}
      MANDOFORGE_APPROVAL_NOTIFICATION_DEPLOYMENT_CONTROLLER_URL: ${MANDOFORGE_APPROVAL_NOTIFICATION_DEPLOYMENT_CONTROLLER_URL:-}
      MANDOFORGE_APPROVAL_NOTIFICATION_DEPLOYMENT_CONTROLLER_TOKEN: ${MANDOFORGE_APPROVAL_NOTIFICATION_DEPLOYMENT_CONTROLLER_TOKEN:-}
      MANDOFORGE_APPROVAL_NOTIFICATION_DEPLOYMENT_TIMEOUT_SECONDS: ${MANDOFORGE_APPROVAL_NOTIFICATION_DEPLOYMENT_TIMEOUT_SECONDS:-15}
      MANDOFORGE_APPROVAL_NOTIFICATION_OPS_CONTROLLER_REQUIRED: ${MANDOFORGE_APPROVAL_NOTIFICATION_OPS_CONTROLLER_REQUIRED:-false}
      MANDOFORGE_APPROVAL_NOTIFICATION_OPS_CONTROLLER_URL: ${MANDOFORGE_APPROVAL_NOTIFICATION_OPS_CONTROLLER_URL:-}
      MANDOFORGE_APPROVAL_NOTIFICATION_OPS_CONTROLLER_TOKEN: ${MANDOFORGE_APPROVAL_NOTIFICATION_OPS_CONTROLLER_TOKEN:-}
      MANDOFORGE_APPROVAL_NOTIFICATION_OPS_TIMEOUT_SECONDS: ${MANDOFORGE_APPROVAL_NOTIFICATION_OPS_TIMEOUT_SECONDS:-15}
      MANDOFORGE_TENANT_ROUTING_CONTROLLER_REQUIRED: ${MANDOFORGE_TENANT_ROUTING_CONTROLLER_REQUIRED:-false}
      MANDOFORGE_TENANT_ROUTING_CONTROLLER_URL: ${MANDOFORGE_TENANT_ROUTING_CONTROLLER_URL:-}
      MANDOFORGE_TENANT_ROUTING_CONTROLLER_TOKEN: ${MANDOFORGE_TENANT_ROUTING_CONTROLLER_TOKEN:-}
      MANDOFORGE_TENANT_ROUTING_TIMEOUT_SECONDS: ${MANDOFORGE_TENANT_ROUTING_TIMEOUT_SECONDS:-15}
      MANDOFORGE_WORKER_LOAD_VALIDATION_CONTROLLER_REQUIRED: ${MANDOFORGE_WORKER_LOAD_VALIDATION_CONTROLLER_REQUIRED:-false}
      MANDOFORGE_WORKER_LOAD_VALIDATION_CONTROLLER_URL: ${MANDOFORGE_WORKER_LOAD_VALIDATION_CONTROLLER_URL:-}
      MANDOFORGE_WORKER_LOAD_VALIDATION_CONTROLLER_TOKEN: ${MANDOFORGE_WORKER_LOAD_VALIDATION_CONTROLLER_TOKEN:-}
      MANDOFORGE_WORKER_LOAD_VALIDATION_TIMEOUT_SECONDS: ${MANDOFORGE_WORKER_LOAD_VALIDATION_TIMEOUT_SECONDS:-15}
      MANDOFORGE_MCP_GATEWAY_URL: ${MANDOFORGE_MCP_GATEWAY_URL:-}
      MANDOFORGE_MCP_ALLOWED_SERVERS: ${MANDOFORGE_MCP_ALLOWED_SERVERS:-}
      MANDOFORGE_MCP_TIMEOUT_SECONDS: ${MANDOFORGE_MCP_TIMEOUT_SECONDS:-10}
      MANDOFORGE_MCP_DEPLOYMENT_CONTROLLER_REQUIRED: ${MANDOFORGE_MCP_DEPLOYMENT_CONTROLLER_REQUIRED:-false}
      MANDOFORGE_MCP_DEPLOYMENT_CONTROLLER_URL: ${MANDOFORGE_MCP_DEPLOYMENT_CONTROLLER_URL:-}
      MANDOFORGE_MCP_DEPLOYMENT_CONTROLLER_TOKEN: ${MANDOFORGE_MCP_DEPLOYMENT_CONTROLLER_TOKEN:-}
      MANDOFORGE_MCP_ROLLOUT_CONTROLLER_REQUIRED: ${MANDOFORGE_MCP_ROLLOUT_CONTROLLER_REQUIRED:-false}
      MANDOFORGE_MCP_ROLLOUT_CONTROLLER_URL: ${MANDOFORGE_MCP_ROLLOUT_CONTROLLER_URL:-}
      MANDOFORGE_MCP_ROLLOUT_CONTROLLER_TOKEN: ${MANDOFORGE_MCP_ROLLOUT_CONTROLLER_TOKEN:-}
      MANDOFORGE_MCP_ROLLOUT_ROLLBACK_CONTROLLER_REQUIRED: ${MANDOFORGE_MCP_ROLLOUT_ROLLBACK_CONTROLLER_REQUIRED:-false}
      MANDOFORGE_MCP_ROLLOUT_ROLLBACK_CONTROLLER_URL: ${MANDOFORGE_MCP_ROLLOUT_ROLLBACK_CONTROLLER_URL:-}
      MANDOFORGE_MCP_ROLLOUT_ROLLBACK_CONTROLLER_TOKEN: ${MANDOFORGE_MCP_ROLLOUT_ROLLBACK_CONTROLLER_TOKEN:-}
      MANDOFORGE_AGENT_RELEASE_CONTROLLER_REQUIRED: ${MANDOFORGE_AGENT_RELEASE_CONTROLLER_REQUIRED:-false}
      MANDOFORGE_AGENT_RELEASE_CONTROLLER_URL: ${MANDOFORGE_AGENT_RELEASE_CONTROLLER_URL:-}
      MANDOFORGE_AGENT_RELEASE_CONTROLLER_TOKEN: ${MANDOFORGE_AGENT_RELEASE_CONTROLLER_TOKEN:-}
      MANDOFORGE_AGENT_RELEASE_TIMEOUT_SECONDS: ${MANDOFORGE_AGENT_RELEASE_TIMEOUT_SECONDS:-15}
      MANDOFORGE_AGENT_RELEASE_DEPLOYMENT_CONTROLLER_REQUIRED: ${MANDOFORGE_AGENT_RELEASE_DEPLOYMENT_CONTROLLER_REQUIRED:-false}
      MANDOFORGE_AGENT_RELEASE_DEPLOYMENT_CONTROLLER_URL: ${MANDOFORGE_AGENT_RELEASE_DEPLOYMENT_CONTROLLER_URL:-}
      MANDOFORGE_AGENT_RELEASE_DEPLOYMENT_CONTROLLER_TOKEN: ${MANDOFORGE_AGENT_RELEASE_DEPLOYMENT_CONTROLLER_TOKEN:-}
      MANDOFORGE_AGENT_RELEASE_DEPLOYMENT_TIMEOUT_SECONDS: ${MANDOFORGE_AGENT_RELEASE_DEPLOYMENT_TIMEOUT_SECONDS:-15}
      MANDOFORGE_AGENT_RELEASE_ORCHESTRATION_CONTROLLER_REQUIRED: ${MANDOFORGE_AGENT_RELEASE_ORCHESTRATION_CONTROLLER_REQUIRED:-false}
      MANDOFORGE_AGENT_RELEASE_ORCHESTRATION_CONTROLLER_URL: ${MANDOFORGE_AGENT_RELEASE_ORCHESTRATION_CONTROLLER_URL:-}
      MANDOFORGE_AGENT_RELEASE_ORCHESTRATION_CONTROLLER_TOKEN: ${MANDOFORGE_AGENT_RELEASE_ORCHESTRATION_CONTROLLER_TOKEN:-}
      MANDOFORGE_AGENT_RELEASE_ORCHESTRATION_TIMEOUT_SECONDS: ${MANDOFORGE_AGENT_RELEASE_ORCHESTRATION_TIMEOUT_SECONDS:-15}
      MANDOFORGE_AGENT_RELEASE_ROLLBACK_CONTROLLER_REQUIRED: ${MANDOFORGE_AGENT_RELEASE_ROLLBACK_CONTROLLER_REQUIRED:-false}
      MANDOFORGE_AGENT_RELEASE_ROLLBACK_CONTROLLER_URL: ${MANDOFORGE_AGENT_RELEASE_ROLLBACK_CONTROLLER_URL:-}
      MANDOFORGE_AGENT_RELEASE_ROLLBACK_CONTROLLER_TOKEN: ${MANDOFORGE_AGENT_RELEASE_ROLLBACK_CONTROLLER_TOKEN:-}
      MANDOFORGE_AGENT_RELEASE_ROLLBACK_TIMEOUT_SECONDS: ${MANDOFORGE_AGENT_RELEASE_ROLLBACK_TIMEOUT_SECONDS:-15}
      MANDOFORGE_OBSERVABILITY_COLLECTOR_DEPLOYMENT_CONTROLLER_REQUIRED: ${MANDOFORGE_OBSERVABILITY_COLLECTOR_DEPLOYMENT_CONTROLLER_REQUIRED:-false}
      MANDOFORGE_OBSERVABILITY_COLLECTOR_DEPLOYMENT_CONTROLLER_URL: ${MANDOFORGE_OBSERVABILITY_COLLECTOR_DEPLOYMENT_CONTROLLER_URL:-}
      MANDOFORGE_OBSERVABILITY_COLLECTOR_DEPLOYMENT_CONTROLLER_TOKEN: ${MANDOFORGE_OBSERVABILITY_COLLECTOR_DEPLOYMENT_CONTROLLER_TOKEN:-}
      MANDOFORGE_OBSERVABILITY_COLLECTOR_DEPLOYMENT_TIMEOUT_SECONDS: ${MANDOFORGE_OBSERVABILITY_COLLECTOR_DEPLOYMENT_TIMEOUT_SECONDS:-15}
      MANDOFORGE_OBSERVABILITY_COLLECTOR_CLUSTER_CONTROLLER_REQUIRED: ${MANDOFORGE_OBSERVABILITY_COLLECTOR_CLUSTER_CONTROLLER_REQUIRED:-false}
      MANDOFORGE_OBSERVABILITY_COLLECTOR_CLUSTER_CONTROLLER_URL: ${MANDOFORGE_OBSERVABILITY_COLLECTOR_CLUSTER_CONTROLLER_URL:-}
      MANDOFORGE_OBSERVABILITY_COLLECTOR_CLUSTER_CONTROLLER_TOKEN: ${MANDOFORGE_OBSERVABILITY_COLLECTOR_CLUSTER_CONTROLLER_TOKEN:-}
      MANDOFORGE_OBSERVABILITY_COLLECTOR_CLUSTER_TIMEOUT_SECONDS: ${MANDOFORGE_OBSERVABILITY_COLLECTOR_CLUSTER_TIMEOUT_SECONDS:-15}
      MANDOFORGE_OBSERVABILITY_REMEDIATION_CONTROLLER_REQUIRED: ${MANDOFORGE_OBSERVABILITY_REMEDIATION_CONTROLLER_REQUIRED:-false}
      MANDOFORGE_OBSERVABILITY_REMEDIATION_CONTROLLER_URL: ${MANDOFORGE_OBSERVABILITY_REMEDIATION_CONTROLLER_URL:-}
      MANDOFORGE_OBSERVABILITY_REMEDIATION_CONTROLLER_TOKEN: ${MANDOFORGE_OBSERVABILITY_REMEDIATION_CONTROLLER_TOKEN:-}
      MANDOFORGE_OBSERVABILITY_REMEDIATION_TIMEOUT_SECONDS: ${MANDOFORGE_OBSERVABILITY_REMEDIATION_TIMEOUT_SECONDS:-15}
    ports:
      - "127.0.0.1:${MANDOFORGE_API_HOST_PORT:-18787}:8787"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - workspace-data:/var/lib/mandoforge/workspaces
      - ./evidence:/evidence

  worker:
    image: ${MANDOFORGE_IMAGE:-ghcr.io/proerror77/mandoforge/mandoforge-api:${MANDOFORGE_IMAGE_TAG:-latest}}
    command: ["mandoforge-worker"]
    environment:
      BASE_URL: http://api:8787
      WORKER_ID: ${MANDOFORGE_WORKER_ID:-whiskey-pilot-worker-1}
      POLL_INTERVAL_SECONDS: ${MANDOFORGE_WORKER_POLL_INTERVAL_SECONDS:-2}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  workspace-data:
