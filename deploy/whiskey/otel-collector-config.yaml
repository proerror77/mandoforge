receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch: {}
exporters:
  debug: {}
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
service:
  extensions:
    - health_check
  pipelines:
    logs:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - debug
    traces:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - debug
    metrics:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - debug
