apiVersion: batch/v1
kind: Job
metadata:
  name: mandoforge-runtime-production-evidence
  labels:
    app.kubernetes.io/name: mandoforge
    app.kubernetes.io/component: runtime-production-evidence
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mandoforge
        app.kubernetes.io/component: runtime-production-evidence
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runtime-production-evidence
          image: mandoforge-api:latest
          imagePullPolicy: IfNotPresent
          command:
            - /app/scripts/runtime-production-readiness-gate.sh
          envFrom:
            - secretRef:
                name: mandoforge-stage2-controller-env
          env:
            - name: BASE_URL
              value: http://mandoforge-api:8787
            - name: EVIDENCE_DIR
              value: /evidence/runtime-production
            - name: SOURCE_EVIDENCE_DIR
              value: /evidence
            - name: RUNTIME_PRODUCTION_RECOVERY_EVIDENCE_FILE
              value: /evidence/runtime-production-recovery-evidence.json
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: evidence
              mountPath: /evidence
      volumes:
        - name: evidence
          persistentVolumeClaim:
            claimName: mandoforge-stage2-production-evidence
