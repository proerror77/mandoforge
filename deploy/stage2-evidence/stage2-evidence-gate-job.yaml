apiVersion: batch/v1
kind: Job
metadata:
  name: mandoforge-stage2-evidence-gate
  labels:
    app.kubernetes.io/name: mandoforge
    app.kubernetes.io/component: stage2-evidence-gate
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mandoforge
        app.kubernetes.io/component: stage2-evidence-gate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stage2-evidence-gate
          image: mandoforge-api:latest
          imagePullPolicy: IfNotPresent
          command:
            - /app/scripts/stage2-production-evidence-gate.sh
          env:
            - name: BASE_URL
              value: http://mandoforge-api:8787
            - name: ALLOW_BLOCKED
              value: "1"
            - name: RUN_STAGE2_PRODUCTION_VALIDATIONS
              value: "0"
            - name: RUN_STAGE2_SECRET_LIFECYCLE
              value: "0"
            - name: RUN_STAGE2_PROVIDER_ROLLOUT
              value: "0"
            - name: RUN_STAGE2_REMOTE_SIDECAR_RECOVERY
              value: "0"
            - name: RUN_STAGE2_APPROVAL_DELIVERY
              value: "0"
            - name: RUN_STAGE2_CODEX_STALE_POLL
              value: "0"
            - name: RUN_STAGE2_EVAL_RELEASE_AUTOMATION
              value: "0"
            - name: RUN_STAGE2_OBSERVABILITY_REMEDIATION
              value: "0"
            - name: RUN_STAGE2_FINANCE_CONTROLLERS
              value: "0"
            - name: VERIFY_STAGE2_VALIDATION_COVERAGE
              value: "0"
            - name: EVIDENCE_DIR
              value: /evidence
            - name: MANDOFORGE_STAGE2_GATE_SUBJECT
              valueFrom:
                secretKeyRef:
                  name: mandoforge-secrets
                  key: MANDOFORGE_SCHEDULER_SUBJECT
            - name: MANDOFORGE_STAGE2_GATE_ROLES
              valueFrom:
                secretKeyRef:
                  name: mandoforge-secrets
                  key: MANDOFORGE_SCHEDULER_ROLES
            - name: MANDOFORGE_DEV_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mandoforge-secrets
                  key: MANDOFORGE_DEV_ADMIN_TOKEN
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: evidence
              mountPath: /evidence
      volumes:
        - name: evidence
          emptyDir: {}
