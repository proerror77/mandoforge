apiVersion: v1
kind: Secret
metadata:
  name: mandoforge-stage2-controller-env
  labels:
    app.kubernetes.io/name: mandoforge
    app.kubernetes.io/component: stage2-evidence-gate
type: Opaque
stringData:
  # Copy from stage2-production-controllers.env.example and replace placeholders
  # inside your secret manager or deployment pipeline. Do not commit real values.
  RUN_STAGE2_PRODUCTION_VALIDATIONS: "1"
  VERIFY_STAGE2_VALIDATION_COVERAGE: "1"
  RUN_STAGE2_UI_ACTIONBOOK: "1"
  RUN_STAGE2_UI_STATIC_ASSETS: "1"
  RUN_STAGE2_COMPLETION_AUDIT: "1"
  ALLOW_BLOCKED: "0"
