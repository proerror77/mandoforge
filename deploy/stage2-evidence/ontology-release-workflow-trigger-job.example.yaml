apiVersion: batch/v1
kind: Job
metadata:
  name: mandoforge-ontology-release-workflow-trigger
  labels:
    app.kubernetes.io/name: mandoforge
    app.kubernetes.io/component: ontology-release-workflow-trigger
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mandoforge
        app.kubernetes.io/component: ontology-release-workflow-trigger
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ontology-release-workflow-trigger
          image: mandoforge-api:latest
          imagePullPolicy: IfNotPresent
          command:
            - /app/scripts/ontology-release-workflow-trigger-gate.sh
          envFrom:
            - secretRef:
                name: mandoforge-stage2-controller-env
          env:
            - name: BASE_URL
              value: http://mandoforge-api:8787
            - name: EVIDENCE_DIR
              value: /evidence/ontology-release-workflow-trigger
            - name: MANDOFORGE_ONTOLOGY_WORKFLOW_TRIGGER_DOMAIN_SCOPE
              value: commerce
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: evidence
              mountPath: /evidence
      volumes:
        - name: evidence
          persistentVolumeClaim:
            claimName: mandoforge-stage2-production-evidence
