[workspace]
members = ["crates/mandoforge-api", "crates/mandoforge-desktop"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/proerror77/mandoforge"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
